/* Type floor: labels ≥13px, supporting text ≥16px, everywhere */

.med-card small,.education-card small,.flowchart-head small,.sheet-head small,.med-detail dt,.dose-callout small,.source-band>span,.preview-task>span{font-size:13px}
.source-band>small,.ref-tags span,.reference-list small,.reference-list p,.version-card span,.version-card p{font-size:13px}
.quick-strip strong{font-size:16px}.quick-strip small,.home-foot small,.home-foot strong{font-size:14px}
.filter-chips button,.segmented button{font-size:15px;min-height:44px}
.timer-list strong{font-size:17px}.timer-list small{font-size:15px}.timer-list button{font-size:15px;padding:10px 12px;min-height:44px}
.timeline-list article{grid-template-columns:64px 1fr}.timeline-list time,.timeline-list strong{font-size:15px}.timeline-list small{font-size:12px}
.due-callout strong{font-size:19px}.due-callout span{font-size:15px}
.microcopy,.about-list>div{font-size:14px}.toast{font-size:15px}
.completed-item strong{font-size:16px}.completed-item small{font-size:14px}.completed-item button{font-size:15px;min-height:44px;padding:0 14px}
/* Compact chrome */
.app-header{height:56px;padding:6px 12px}.brand-mark{width:36px;height:36px}
.clinical-notice{font-size:13px;padding:6px 36px 6px 12px}
.app-shell{padding-bottom:calc(68px + var(--safe-bottom))}
.bottom-nav{height:calc(60px + var(--safe-bottom));padding-top:4px}.nav-item{min-height:48px}.nav-item small{font-size:12px}

/* ---------- Active session: clinical cockpit ---------- */
[hidden]{display:none!important}
body.in-cockpit .app-header,body.in-cockpit .bottom-nav,body.in-cockpit .clinical-notice{display:none}

.cockpit-head{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);border-top:4px solid var(--navy);box-shadow:0 6px 16px rgba(11,33,73,.08);padding:4px 10px 6px}
.cockpit-head.crimson{border-top-color:var(--crimson)}.cockpit-head.amber{border-top-color:var(--amber)}.cockpit-head.violet{border-top-color:var(--violet)}

.cockpit-head.simulation{border-top-color:var(--teal)}

.sim-time-btn{flex:none;min-height:44px;padding:0 12px;border-radius:11px;border:1.5px solid #7cc4b9;background:#e8f7f4;color:#0f6f66;font-size:15px;font-weight:900;white-space:nowrap}
.sim-time-btn.paused{background:#0e8077;border-color:#0e8077;color:#fff}

.sim-sheet-grid .button:last-child{grid-column:1/-1}
.cockpit-row{display:grid;grid-template-columns:minmax(0,auto) 1fr auto auto;align-items:center;gap:8px;min-height:54px}
.cockpit-id{display:flex;flex-direction:column;gap:3px;min-width:0}

.cockpit-icon.on{background:#e8f7f0;border-color:#a4dec2}

.cockpit-status{display:flex;align-items:center;gap:8px;min-height:28px;font-size:16px;color:#34445c;white-space:nowrap;overflow:hidden}
.cockpit-status .next-up{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.overdue-count{flex:none;background:#b4192f;color:#fff;border-radius:7px;padding:2px 8px;font-size:15px;font-weight:900}
.live-countdown,.live-overdue{font-variant-numeric:tabular-nums}

.alert-strip{display:flex;gap:6px;margin:8px 10px 0}

.alert-main>span{font-size:15px;font-weight:700}
.alert-more{flex:none;min-width:52px;font-size:17px;font-weight:900;text-align:center!important}
.cockpit-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 2px}
.cockpit-tabs button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:15px;font-weight:800;color:var(--navy);padding:0 4px;display:flex;align-items:center;justify-content:center;gap:5px}
.cockpit-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}

body.in-cockpit .task-status{display:block}

.task-row{width:100%;min-height:56px;margin-bottom:6px;padding:9px 12px;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid #7e8ba0;border-radius:12px;color:var(--ink)}
.task-row.critical{border-left-color:#c72f48}.task-row.high{border-left-color:#d78300}

.task-row:active{background:#eef3fa}

/* Drawer */
.menu-drawer{position:fixed;z-index:95;top:0;left:0;bottom:0;width:min(86vw,330px);background:#fff;box-shadow:12px 0 40px rgba(5,15,35,.25);transform:translateX(-102%);transition:transform .16s ease;display:flex;flex-direction:column;padding:10px 10px calc(14px + var(--safe-bottom));overflow:auto}
.menu-drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.drawer-head>div{flex:1;display:flex;flex-direction:column}.drawer-head strong{font-size:17px;color:var(--navy)}.drawer-head small{font-size:14px;color:var(--muted)}
.menu-drawer>button,.menu-drawer>a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:17px;font-weight:700;color:var(--ink);text-decoration:none}
.menu-drawer>button:hover,.menu-drawer>a:hover,.menu-drawer>button.active{background:#eef3fa;color:var(--navy)}
.menu-drawer small{font-size:14px;color:var(--muted);font-weight:600}
.menu-drawer hr{border:0;border-top:1px solid var(--line);margin:6px 4px;width:calc(100% - 8px)}
.install-steps{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}.install-steps h3{margin:0 0 6px;font-size:16px}.install-steps ol{margin:0;padding-left:20px;font-size:16px;line-height:1.5}
/* Hero */
.hero-aurora{position:relative;height:132px;overflow:hidden;background:linear-gradient(120deg,#0a2a6b,#0b4f8a 55%,#0f8b98)}

/* Landing */
.home-label{margin:14px 16px 8px;font-size:14px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#4a5a72}

.emergency-grid .emergency-card:first-child{grid-column:auto}
.emergency-card.crimson{background:linear-gradient(90deg,#fff5f6,#fff 70%)}.emergency-card.amber{background:linear-gradient(90deg,#fff9ec,#fff 70%)}.emergency-card.violet{background:linear-gradient(90deg,#f7f3ff,#fff 70%)}
.em-icon,.em-icon img{display:block;width:56px;height:56px;border-radius:14px}
.em-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.emergency-grid .emergency-card strong{font-size:20px;line-height:1.15}
.emergency-grid .emergency-card small{font-size:16px;line-height:1.3}
@media(min-width:760px){.emergency-grid{grid-template-columns:repeat(3,1fr)}.emergency-grid .emergency-card{grid-template-columns:56px minmax(0,1fr);align-content:start}.emergency-grid .emergency-card .chevron{display:none}}
.home-foot{margin:14px 12px 6px;background:#e3f5f2;padding:12px 14px;align-items:center}
.home-foot strong{color:#0f6f66;font-size:15px}.home-foot small{color:#2f6f68;font-size:14px}
.home-foot a{white-space:nowrap;text-decoration:none;font-size:15px}
.home-meta{margin:6px 16px 14px;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.preview-title .em-icon,.preview-title .em-icon img{width:64px;height:64px;border-radius:16px}
/* Bottom nav icons */
.nav-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item small{font-size:13px}
/* Larger text: scales the whole interface, cockpit and sheets included */
html.text-lg{zoom:1.15}
/* Hero grows with its text (larger text, narrow phones) instead of clipping */
.hero-aurora{height:auto;min-height:132px;display:flex;align-items:center}
.hero-copy{height:auto;padding-top:14px;padding-bottom:14px;max-width:64%}
.hero-copy h1{font-size:clamp(22px,6.6vw,26px)}
@media(min-width:600px){.hero-aurora{min-height:170px}.hero-copy h1{font-size:34px}}
@media(min-width:800px){.hero-aurora{min-height:190px}}
.home-label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.home-label .hero-status{margin:0;color:#2f5f3f;background:#eaf7f1;border-color:#bfe6d1;text-transform:none;letter-spacing:0;font-size:13px}
/* Larger text on small phones: two-row cockpit header and 2x2 tools — never smaller type */
@media(max-width:400px){
  html.text-lg .cockpit-row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"id sound end" "clock clock clock";row-gap:2px}
  html.text-lg .cockpit-id{grid-area:id}html.text-lg .cockpit-icon{grid-area:sound}html.text-lg .cockpit-end{grid-area:end}
  html.text-lg .cockpit-clock{grid-area:clock;flex-direction:row;align-items:baseline;justify-content:center;gap:8px}
  html.text-lg .cockpit-tabs{grid-template-columns:1fr 1fr}
  html.text-lg .task-actions{flex-wrap:wrap}html.text-lg .task-actions .card-primary{flex:1 1 100%}
}
.home-label .hero-status{white-space:nowrap;flex:none}.home-label>span:first-child{min-width:0}
.hdr-avatar{padding:0;overflow:hidden;background:#0b2a6b}.hdr-avatar picture,.hdr-avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}

/* =====================================================================
   FLOWCHART ENGINE — Overview · Guided · Full chart (v0.13)
   ===================================================================== */
.acc-crimson{--acc:#c4314b;--acc-soft:#fff1f3}.acc-amber{--acc:#b86e00;--acc-soft:#fff6e3}.acc-violet{--acc:#6a46c2;--acc-soft:#f4f0ff}
.fc-strip{position:sticky;top:60px;z-index:25;display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(11,33,73,.06);min-height:52px}
.fc-strip .mode-tag{font-size:12px}.fc-strip.simulation .mode-tag{background:var(--teal)}
.fc-strip strong{font-size:24px;font-variant-numeric:tabular-nums;color:var(--navy)}
.fc-strip button{margin-left:auto;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:16px;font-weight:800}
.fc-head{display:flex;gap:12px;align-items:center;padding:14px 14px 8px}
.fc-head h1{margin:0 0 8px;font-size:24px;line-height:1.12;color:var(--navy);letter-spacing:-.02em}
.fc-head .em-icon,.fc-head .em-icon img{width:52px;height:52px;border-radius:14px}
.fc-emerg{display:flex;gap:6px;flex-wrap:wrap}
.fc-emerg button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;font-weight:800}
.fc-emerg button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.fc-views{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 12px 10px;padding:4px;border-radius:14px;background:#fff;border:1px solid var(--line);position:sticky;top:60px;z-index:20}
body:has(.fc-strip) .fc-views{top:112px}
.fc-views button{min-height:46px;border:0;border-radius:10px;background:transparent;font-size:16px;font-weight:800;color:var(--navy)}
.fc-views button.active{background:linear-gradient(180deg,#2f6fe0,#1d55c4);color:#fff;box-shadow:0 3px 10px rgba(29,85,196,.25)}
.fc-body{padding:0 12px 6px}
/* Overview */
.ov{display:flex;flex-direction:column;align-items:stretch}
.ov-row{display:grid;gap:8px;grid-template-columns:1fr}
.ov-row.n2{grid-template-columns:1fr 1fr}
.ov-arrow{text-align:center;color:#2b4b7e;font-size:22px;font-weight:900;line-height:1;padding:3px 0}
.ov-box{position:relative;text-align:left;background:#fff;border:1.5px solid #cfd8e6;border-radius:14px;padding:10px 12px;color:var(--ink);box-shadow:0 2px 8px rgba(11,33,73,.04);min-height:56px}
.ov-box ul{margin:4px 0 0;padding-left:18px}.ov-box li,.ov-box p{font-size:16px;line-height:1.35;margin:2px 0 0;color:#34445c}
.ov-title{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;font-size:18px;font-weight:900;line-height:1.2;color:var(--navy)}
.ov-box.t-start{background:var(--acc,#c4314b);border-color:var(--acc,#c4314b);text-align:center;box-shadow:0 6px 16px rgba(120,20,40,.18)}
.ov-box.t-start .ov-title{color:#fff;justify-content:center;font-size:20px}.ov-box.t-start p{color:#fff;opacity:.95}
.ov-box.meds{background:#fff8e6;border-color:#ecc56b}
.ov-box.t-decision{background:#e9f1ff;border:2px solid #2f6fe0;text-align:center;border-radius:18px}.ov-box.t-decision .ov-title{justify-content:center}
.ov-box.t-endpoint{background:#eefaf3;border-color:#93d3ae}.ov-box.t-endpoint .ov-title{color:#17673e}
.ov-box.t-escalation{background:#fff1f3;border-color:#e58c9b}.ov-box.t-escalation .ov-title{color:#a3162d}
.ov-branch{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.04em;color:#fff;background:#2f6fe0;border-radius:6px;padding:1px 8px;margin-bottom:4px}
.t-endpoint .ov-branch{background:#1f8a5b}.t-escalation .ov-branch{background:#b4192f}
.ov-group{border:1.5px solid #a9c1ea;background:#eef4ff;border-radius:16px;padding:0 8px 8px;overflow:hidden}
.ov-group-head{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% + 16px);margin:0 -8px 8px;min-height:40px;border:0;background:#1d3f7a;color:#fff;font-size:15px;font-weight:900;padding:6px 10px}
.ov-group-cells{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ov-group .ov-box{min-height:0;padding:8px 10px}.ov-group .ov-title{font-size:17px}
.fc-status{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:900;color:#fff;background:#9aa8bb}
.fc-status.done{background:#1f8a5b}.fc-status.overdue{background:#b4192f}.fc-status.active{background:#d58b0a}
.ov-box.s-done{opacity:.82}.ov-box.s-overdue{outline:3px solid #e6a1ac}
.ov.compact .ov-title{font-size:16px}.ov.compact .ov-box p,.ov.compact li{font-size:15px}
/* Guided */
.g-progress{display:flex;align-items:center;gap:10px;margin:2px 2px 4px}
.g-progress span{font-size:16px;font-weight:900;color:var(--navy);white-space:nowrap}
.g-progress .bar{flex:1;height:8px;border-radius:99px;background:#dde5f0;overflow:hidden}.g-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fe0,#1d55c4);border-radius:99px}
.g-mode-note{margin:0 2px 8px;font-size:14px;color:var(--muted)}
.g-step{display:block;width:100%;border-radius:16px;margin-bottom:8px}
.g-step.current{background:#fff;border:2px solid #f0b8c2;box-shadow:0 8px 20px rgba(150,20,40,.08);padding:0 0 12px;overflow:hidden}
.g-step.current h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:10px 14px;background:linear-gradient(180deg,#fff0f2,#ffe6ea);font-size:21px;color:#9b1a30}
.acc-amber .g-step.current{border-color:#efcf8a}.acc-amber .g-step.current h3{background:linear-gradient(180deg,#fff8e8,#fff0d2);color:#7a4b00}
.acc-violet .g-step.current{border-color:#cdbdf0}.acc-violet .g-step.current h3{background:linear-gradient(180deg,#f6f2ff,#ece4ff);color:#4b2d9a}
.g-step .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--acc,#c4314b);color:#fff;font-size:17px;font-weight:900}
.g-parallel{margin:0 14px 6px;font-size:15px;font-weight:800;color:#1d55c4}
.g-node{margin:0 10px 6px;border-top:1px solid #f0f2f6;padding-top:4px}
.g-node:first-of-type{border-top:0}
.g-node-head{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:6px 4px;font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#4a5a72;text-align:left}
.g-node-head i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid #cbd6e4;display:grid;place-items:center;font-family:Georgia,serif;text-transform:none;color:var(--navy)}
.g-check{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:52px;padding:10px 8px;border:0;border-bottom:1px solid #eef1f5;background:transparent;text-align:left;font-size:18px;line-height:1.3;color:var(--ink)}
.g-check .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #9aa8bb;display:grid;place-items:center;color:#fff;font-weight:900;margin-top:-1px}
.g-check.on .box{background:#1f8a5b;border-color:#1f8a5b}.g-check.on>span:last-child{color:#4a5a72;text-decoration:line-through;text-decoration-color:#9aa8bb}
.g-check.overdue .box{border-color:#b4192f}.g-check em{font-style:normal;font-size:14px;font-weight:900;color:#b4192f}
.g-med{display:flex;align-items:center;gap:10px;width:calc(100% - 4px);min-height:48px;margin:6px 2px 0;padding:8px 12px;border:1px solid #ecc56b;background:#fff8e6;border-radius:12px;text-align:left;font-size:17px;font-weight:700;color:#5f3c00}
.g-med>span{flex:none;width:30px;height:30px;border-radius:8px;background:#ffe6a8;display:grid;place-items:center;font-weight:900;font-size:13px}
.g-med b{margin-left:auto;font-size:22px;color:#a87a1a}
.g-med.path{border-color:#a9c1ea;background:#eef4ff;color:#1d3f7a}.g-med.path>span{background:#d7e4fb}
.g-info{display:flex;flex-direction:column;gap:2px;width:calc(100% - 20px);margin:6px 10px 0;padding:10px 12px;border:1px solid #d9cff3;background:#f7f3ff;border-radius:12px;text-align:left}
.g-info strong{font-size:18px;color:#4b2d9a}.g-info span{font-size:16px;color:#34445c}
.g-question{margin:6px 12px 0}.g-question p{margin:0;font-size:22px;font-weight:900;color:var(--navy);text-align:center}.g-question>span{display:block;text-align:center;font-size:16px;color:var(--muted);margin:2px 0 10px}
.g-branches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-branch{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:72px;padding:10px 12px;border-radius:14px;border:2px solid #a9c1ea;background:#eef4ff;text-align:left;color:var(--navy);width:100%}
.g-branch strong{font-size:20px}.g-branch span{font-size:16px;line-height:1.25}
.g-branch.good{border-color:#93d3ae;background:#eefaf3;color:#17673e}.g-branch.bad{border-color:#e58c9b;background:#fff1f3;color:#a3162d}
.g-branch.chosen{box-shadow:0 0 0 3px rgba(31,138,91,.35)}
.g-outcome{margin:10px 12px 0;padding:6px 0 0;border-top:1px dashed #cbd6e4;display:grid;gap:8px}
.g-outcome .g-node{margin:0}
.g-next{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:12px 12px 0;min-height:56px;border:0;border-radius:14px;background:linear-gradient(180deg,#2f6fe0,#1d55c4);color:#fff;font-size:19px;font-weight:900;box-shadow:0 6px 16px rgba(29,85,196,.3)}
.g-step.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:1px solid var(--line);background:#fff;text-align:left;font-size:18px;font-weight:800;color:var(--ink)}
.g-step.row .num{background:#c8d2e0;color:#34445c}.g-step.row b{margin-left:auto;font-size:24px;color:#8b9ab0}
.g-step.row.past{background:#f3f8f5;border-color:#cfe8da}.g-step.row.past .num{background:#1f8a5b;color:#fff}
.g-step.row.esc{border-color:#efb3bd;background:#fff7f8;color:#a3162d}.g-step.row.esc .num{background:#c4314b;color:#fff}
/* Full chart */
.fc-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.fc-tools button{min-height:44px;min-width:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:17px;font-weight:900}
.fc-tools button[data-zoom=print]{margin-left:auto;font-size:15px}
.fc-viewport{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#f7f9fc;touch-action:none;cursor:grab;min-height:280px}
.fc-viewport:active{cursor:grabbing}.fc-viewport:focus-visible{outline:3px solid #2f6fe0}
.fc-svg{display:block;user-select:none}
.fc-svg .nb{fill:#fff;stroke:#b9c6d8;stroke-width:1.5}
.fc-svg .nt{font:800 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0b2149}

.fc-svg .t-start .nb{fill:var(--acc,#c4314b);stroke:none}.fc-svg .t-start .nt,.fc-svg .t-start .ns{fill:#fff}

  <script>
const APP_VERSION = "0.13.0-prototype";
const CONTENT_REVIEW_DATE = "2026-11-02";

const REFERENCES = [
  {id:"acog-pph-183",short:"ACOG PB 183",title:"ACOG Practice Bulletin No. 183: Postpartum Hemorrhage",year:"2017",note:"Definition, 4 Ts, uterotonics, TXA, escalation and transfusion principles."},
  {id:"acog-pph-device",short:"ACOG CPU",title:"Use of Nonsurgical Hemorrhage-Control Devices for Postpartum Hemorrhage Management",year:"2025",note:"Balloon tamponade and vacuum-induced hemorrhage-control devices within a comprehensive algorithm."},
  {id:"acog-htn",short:"ACOG PB 222",title:"ACOG Practice Bulletin No. 222: Gestational Hypertension and Preeclampsia",year:"2020",note:"Severe features, urgent antihypertensive therapy, magnesium sulfate and delivery principles."},
  {id:"acog-ed-htn",short:"ACOG ED HTN",title:"Acute Hypertension in Pregnancy & Postpartum Algorithm",year:"2023",note:"Emergency department recognition and sequential labetalol, hydralazine and nifedipine pathways."},
  {id:"acog-ed-eclampsia",short:"ACOG ED Eclampsia",title:"Eclampsia Algorithm",year:"2023",note:"Initial seizure care, magnesium, refractory seizure management and toxicity monitoring."},
  {id:"acog-ed-cvd",short:"ACOG ED CVD",title:"Cardiovascular Disease in Pregnancy & Postpartum Algorithm",year:"2023",note:"Pregnancy-status screening, cardiovascular red flags and initial work-up."},
  {id:"ahrq-teamstepps",short:"AHRQ TeamSTEPPS",title:"TeamSTEPPS 3.0 Curriculum",year:"2023",url:"https://www.ahrq.gov/teamstepps-program/curriculum/intro/overview.html",note:"Communication, leadership, situation monitoring and mutual support."}
];

const MEDICATIONS = [
  {id:"oxytocin",name:"Oxytocin",context:"PPH · uterotonic",accent:"crimson",dose:"10–40 units in 500–1,000 mL IV as a continuous infusion; or 10 units IM.",administration:"Do not give as an undiluted IV push. Use institutional preparation and pump policy.",repeat:"Continuous infusion; reassess uterine tone, bleeding and hemodynamic response.",avoid:"Rare hypersensitivity.",watch:"Hypotension with IV push; nausea/vomiting; hyponatremia with prolonged high-dose exposure.",source:"acog-pph-183"},
  {id:"methylergonovine",name:"Methylergonovine",context:"PPH · uterotonic",accent:"crimson",dose:"0.2 mg IM.",administration:"Use after checking contraindications and current blood pressure.",repeat:"May repeat every 2–4 hours per protocol.",avoid:"Hypertension, preeclampsia, cardiovascular disease or hypersensitivity. IV administration is not recommended in the cited bulletin.",watch:"Severe hypertension, nausea and vomiting.",source:"acog-pph-183"},
  {id:"carboprost",name:"Carboprost (15-methyl PGF₂α)",context:"PPH · uterotonic",accent:"crimson",dose:"0.25 mg IM or intramyometrial.",administration:"Confirm pulmonary history before administration.",repeat:"Every 15–90 minutes; maximum 8 doses in the cited bulletin.",avoid:"Asthma. Relative contraindication with hypertension or active hepatic, pulmonary or cardiac disease.",watch:"Bronchospasm, diarrhea, nausea/vomiting, fever, chills and hypertension.",source:"acog-pph-183"},
  {id:"misoprostol",name:"Misoprostol",context:"PPH · uterotonic",accent:"crimson",dose:"600–1,000 micrograms oral, sublingual or rectal.",administration:"Route should follow the approved local hemorrhage protocol.",repeat:"One-time dose in the cited bulletin.",avoid:"Hypersensitivity to medication or prostaglandins.",watch:"Fever, shivering, diarrhea, nausea/vomiting and headache.",source:"acog-pph-183",maxDoses:1},
  {id:"txa",name:"Tranexamic acid (TXA)",context:"PPH · antifibrinolytic",accent:"crimson",dose:"1 g IV over 10–20 minutes within 3 hours of birth for ongoing immediate PPH; a second 1 g dose may be given if bleeding continues after 30 minutes.",administration:"Record actual administration time and notify receiving/consulting teams. Use the approved hospital hemorrhage protocol.",repeat:"Reassess at 30 minutes; time alone does not authorize another dose.",avoid:"Review active thromboembolic disease, contraindications and dose adjustment requirements under local policy.",watch:"Thromboembolic risk assessment, infusion reaction and ongoing bleeding.",source:"acog-pph-183",timer:30,timerLabel:"Reassess bleeding; second TXA dose may be eligible",maxDoses:2},
  {id:"labetalol",name:"Labetalol IV",context:"Severe hypertension",accent:"amber",dose:"20 mg IV over 2 minutes → repeat BP in 10 min; if still severe, 40 mg IV → repeat in 10 min; if still severe, 80 mg IV → repeat in 10 min, then convert/escalate per algorithm.",administration:"Treat persistent SBP ≥160 or DBP ≥110 promptly. The selected ED algorithm uses the 20/40/80 mg sequence.",repeat:"Each confirmed dose starts a 10-minute BP reassessment timer.",avoid:"Asthma, bradycardia, heart block, decompensated cardiac function or preexisting myocardial disease.",watch:"Hypotension, bradycardia and bronchospasm.",source:"acog-ed-htn",timer:10,timerLabel:"Reassess BP after labetalol"},
  {id:"hydralazine",name:"Hydralazine IV",context:"Severe hypertension",accent:"amber",dose:"5–10 mg IV over 2 minutes → repeat BP in 20 min; if still severe, 10 mg IV → repeat in 20 min, then convert/escalate per algorithm.",administration:"Use the exact locally approved sequence; the supplied ED algorithm permits 5–10 mg initially.",repeat:"Each confirmed dose starts a 20-minute BP reassessment timer.",avoid:"No pathway-specific absolute contraindication listed in the supplied ED algorithm; assess for maternal hypotension risk.",watch:"Maternal hypotension, headache and abnormal fetal heart rate tracing.",source:"acog-ed-htn",timer:20,timerLabel:"Reassess BP after hydralazine"},
  {id:"nifedipine",name:"Nifedipine immediate release",context:"Severe hypertension",accent:"amber",dose:"10 mg PO immediate release → repeat BP in 20 min; if still severe, 20 mg PO → repeat in 20 min; one additional 20 mg PO step appears in the supplied ED algorithm before conversion/escalation.",administration:"Useful when IV access is not available. Confirm immediate-release formulation and ability to take oral medication.",repeat:"Each confirmed dose starts a 20-minute BP reassessment timer.",avoid:"Use clinical judgment with hypotension or inability to take oral medication.",watch:"Reflex tachycardia, headache and hypotension.",source:"acog-ed-htn",timer:20,timerLabel:"Reassess BP after nifedipine"},
  {id:"magnesium",name:"Magnesium sulfate",context:"Severe preeclampsia / eclampsia",accent:"violet",dose:"Loading dose 4–6 g IV over 20–30 minutes, then maintenance 1–2 g/hour.",administration:"For eclampsia without IV access: 10 g IM loading (5 g in each buttock), then 5 g IM every 4 hours in the supplied algorithm. Obtain expert guidance for renal dysfunction.",repeat:"Continuous maintenance; a recurrent seizure may prompt an additional magnesium bolus under the approved protocol and clinician direction.",avoid:"Altered renal function requires adjustment and serum monitoring. Confirm local thresholds and orders.",watch:"Respiratory rate, oxygenation, deep tendon reflexes, urine output and signs of toxicity.",source:"acog-ed-eclampsia"},
  {id:"calcium-gluconate",name:"Calcium gluconate",context:"Magnesium toxicity rescue",accent:"violet",dose:"10% solution, 10 mL (1 g) IV over 3 minutes in the supplied eclampsia algorithm.",administration:"Keep immediately available when respiratory depression from magnesium toxicity is a concern; support airway and stop magnesium as clinically indicated.",repeat:"No automatic repeat. Obtain urgent expert guidance.",avoid:"Use with monitoring and clinician/pharmacy confirmation.",watch:"Cardiac rhythm and response to treatment.",source:"acog-ed-eclampsia"},
  {id:"lorazepam",name:"Lorazepam",context:"Persistent/recurrent seizure",accent:"violet",dose:"4 mg IV over 3–5 minutes after magnesium loading when seizure persists or recurs, per supplied algorithm.",administration:"Prepare for airway support and possible intubation.",repeat:"No automatic repeat timer in this prototype.",avoid:"Assess respiratory compromise and cumulative sedative exposure.",watch:"Respiratory depression, hypotension and level of consciousness.",source:"acog-ed-eclampsia"},
  {id:"midazolam",name:"Midazolam",context:"Persistent seizure · no IV",accent:"violet",dose:"10 mg IM if no IV access, per supplied eclampsia algorithm.",administration:"Use when persistent/recurrent seizure follows magnesium loading and IV access is unavailable.",repeat:"No automatic repeat timer in this prototype.",avoid:"Assess respiratory compromise and cumulative sedative exposure.",watch:"Respiratory depression, hypotension and level of consciousness.",source:"acog-ed-eclampsia"}
];

const commonMilestones = [
  {min:5,label:"5-minute team check",message:"Reassess patient status, treatment response, outstanding actions and escalation plan."},
  {min:10,label:"10-minute status update",message:"State the current condition, interventions completed, response and next priorities."},
  {min:15,label:"15-minute huddle",message:"Confirm shared mental model, unresolved threats and need for higher-level resources."}
];

const EMERGENCIES = {
  pph:{
    id:"pph",name:"Postpartum Hemorrhage",short:"Hemorrhage",icon:"◉",accent:"crimson",summary:"Control bleeding while resuscitating and identifying the cause.",source:["acog-pph-183","acog-pph-device"],milestones:commonMilestones,
    tasks:[
      {id:"pph-help",group:"DO NOW",title:"Call for help. Activate the obstetric hemorrhage response.",detail:"Bring the hemorrhage cart, designate a leader and recorder/timekeeper, notify anesthesia and obtain additional obstetric support according to local policy.",type:"once",priority:"critical"},
      {id:"pph-assess",group:"DO NOW",title:"Assess bleeding, uterine tone and maternal status.",detail:"Quantify cumulative blood loss when possible. Assess fundus, vaginal bleeding, vital signs, mental status and perfusion. Hemodynamic changes can occur late.",type:"repeat",repeatMin:5,priority:"critical",review:"The 5-minute recurrence is a prototype setting requiring local approval."},
      {id:"pph-massage",group:"DO IN PARALLEL",title:"Massage the fundus; begin bimanual compression for suspected atony.",detail:"Remove intrauterine clots as appropriate. Continue while uterotonics are prepared and administered. A firm uterus with ongoing bleeding should redirect attention toward Trauma, Tissue and Thrombin.",type:"ongoing",priority:"high"},
      {id:"pph-access",group:"DO IN PARALLEL",title:"Establish rapid access, obtain hemorrhage labs and prepare blood products.",detail:"Use local hemorrhage protocol for IV access, CBC, type and crossmatch, coagulation studies and fibrinogen. Escalate blood-product support based on patient condition and protocol.",type:"once",priority:"high"},
      {id:"pph-oxytocin",group:"TREAT",title:"Give oxytocin; add rapid-sequence uterotonics when indicated.",detail:"Oxytocin is first-line for uterine atony. Select additional agents only after checking hypertension/preeclampsia, asthma and cardiac/hepatic/pulmonary contraindications.",type:"med",meds:["oxytocin","methylergonovine","carboprost","misoprostol"],priority:"high"},
      {id:"pph-cause",group:"IDENTIFY CAUSE",title:"Assess Tone · Trauma · Tissue · Thrombin.",detail:"More than one cause can coexist. Examine the uterus and genital tract, assess placental completeness/retained tissue and evaluate coagulation status.",type:"repeat",repeatMin:10,priority:"high"},
      {id:"pph-txa",group:"TREAT",title:"Consider early TXA for ongoing immediate postpartum hemorrhage.",detail:"The supplied guidance supports 1 g IV over 10–20 minutes within 3 hours of birth, with reassessment before any second dose. Follow the approved local protocol.",type:"med",meds:["txa"],priority:"high"},
      {id:"pph-escalate",group:"ESCALATE",title:"If bleeding continues, escalate without waiting for a timer.",detail:"Activate massive transfusion as indicated. Prepare nonsurgical hemorrhage-control device, operating room, interventional radiology or hysterectomy based on cause, response, resources and patient status. Device use must not delay definitive care or transfer.",type:"once",priority:"critical"}
    ],
    flow:[
      {title:"Recognize",body:"Ongoing abnormal postpartum bleeding or blood loss with hypovolemia signs. Do not wait for hypotension.",tone:"start"},
      {title:"Activate + resuscitate",body:"Call hemorrhage response; leader and recorder; access, monitoring, labs, warming and blood support in parallel.",tone:"critical"},
      {title:"Assess 4 Ts",body:"Tone · Trauma · Tissue · Thrombin. Multiple causes may coexist.",tone:"decision"},
      {title:"Treat cause",body:"Atony: massage/compression + uterotonics. Trauma: identify and repair. Tissue: evaluate/remove. Thrombin: correct coagulopathy.",tone:"action"},
      {title:"Ongoing bleeding?",body:"Reassess response continuously. Consider TXA early when indicated; do not wait for a milestone.",tone:"decision"},
      {title:"Escalate",body:"MTP/blood support · balloon or vacuum-induced control device · OR/IR · definitive surgery/transfer.",tone:"critical"}
    ]
  },
  htn:{
    id:"htn",name:"Acute Severe Hypertension",short:"Severe BP",icon:"↑",accent:"amber",summary:"Confirm persistence, treat promptly and assess severe features.",source:["acog-htn","acog-ed-htn"],milestones:commonMilestones,
    tasks:[
      {id:"htn-help",group:"DO NOW",title:"Notify obstetrics and activate the severe-hypertension response.",detail:"Acute-onset persistent SBP ≥160 or DBP ≥110 is an obstetric emergency during pregnancy and postpartum. Escalate immediately according to local policy.",type:"once",priority:"critical"},
      {id:"htn-bp",group:"DO NOW",title:"Repeat BP with correct technique within 15 minutes.",detail:"Confirm an acute severe value as persistent. Treatment should be given promptly once persistence is established; do not wait four hours.",type:"repeat",repeatMin:15,priority:"critical"},
      {id:"htn-symptoms",group:"DO IN PARALLEL",title:"Assess headache, vision, RUQ/epigastric pain, dyspnea, pulmonary edema and neurologic findings.",detail:"Severe headache with hypertension raises concern for stroke. Evaluate oliguria and other severe features; perform focused neurologic assessment.",type:"repeat",repeatMin:15,priority:"high"},
      {id:"htn-labs",group:"DO IN PARALLEL",title:"Obtain CBC, platelets, AST/ALT, creatinine and urine protein assessment.",detail:"Laboratory severe features include platelets <100 × 10⁹/L, transaminases to twice normal, or creatinine >1.1 mg/dL or doubling without other renal disease.",type:"once",priority:"high"},
      {id:"htn-treat",group:"TREAT",title:"Give a first-line antihypertensive using one approved sequence.",detail:"Labetalol IV, hydralazine IV or immediate-release nifedipine PO are accepted first-line options. Choose based on access and contraindications; start the drug-specific BP timer only after confirming administration.",type:"med",meds:["labetalol","hydralazine","nifedipine"],priority:"critical"},
      {id:"htn-mag",group:"TREAT",title:"Initiate magnesium sulfate when indicated for severe preeclampsia.",detail:"Antihypertensive treatment and magnesium should proceed simultaneously when possible; antihypertensive treatment takes priority if they cannot be concurrent.",type:"med",meds:["magnesium"],priority:"high"},
      {id:"htn-monitor",group:"REASSESS",title:"Reassess BP after every dose and monitor for treatment response.",detail:"The supplied ED algorithm targets 130–150/80–100 mm Hg, then uses a staged monitoring schedule. Confirm target and schedule with local policy.",type:"ongoing",priority:"high"},
      {id:"htn-escalate",group:"ESCALATE",title:"Persistent severe BP or deterioration: obtain emergent higher-level consultation.",detail:"Escalate after failure of the initial sequence, neurologic symptoms, pulmonary edema, HELLP concern or maternal/fetal deterioration. Prepare for delivery based on gestational age and clinical circumstances after stabilization.",type:"once",priority:"critical"}
    ],
    flow:[
      {title:"Identify",body:"≥20 weeks pregnant or ≤6 weeks postpartum with SBP ≥160 or DBP ≥110.",tone:"start"},
      {title:"Confirm persistence",body:"Repeat correctly within 15 minutes while assessing symptoms and preparing medication.",tone:"decision"},
      {title:"Treat promptly",body:"Choose labetalol IV, hydralazine IV or nifedipine IR PO. Record the actual administration time.",tone:"critical"},
      {title:"Reassess by agent",body:"Labetalol: 10 min. Hydralazine: 20 min. Nifedipine: 20 min. Repeat only if still severe and within the approved sequence.",tone:"action"},
      {title:"Severe features",body:"Assess neurologic symptoms, RUQ/epigastric pain, pulmonary edema, platelets, liver enzymes and creatinine; initiate magnesium when indicated.",tone:"decision"},
      {title:"Escalate + plan delivery",body:"Persistent severe BP, stroke concern, HELLP, pulmonary edema or deterioration requires urgent expert support and disposition/delivery planning.",tone:"critical"}
    ]
  },
  eclampsia:{
    id:"eclampsia",name:"Eclampsia / Obstetric Seizure",short:"Eclampsia",icon:"⚡",accent:"violet",summary:"Protect the patient, give magnesium and prepare for recurrence or airway intervention.",source:["acog-htn","acog-ed-eclampsia"],milestones:commonMilestones,
    tasks:[
      {id:"ec-help",group:"DO NOW",title:"Call for help; request immediate obstetric, anesthesia and emergency support.",detail:"Designate a leader and recorder/timekeeper. Prepare airway equipment and medications while supportive seizure care begins.",type:"once",priority:"critical"},
      {id:"ec-safety",group:"DO NOW",title:"Protect from injury; position left lateral when feasible; support airway and breathing.",detail:"Do not forcibly restrain. Prevent aspiration, monitor oxygen saturation and provide usual seizure care. Most eclamptic seizures are self-limited; magnesium prevents recurrence.",type:"ongoing",priority:"critical"},

//   Guided    — numbered steps with checklists, labelled decision branches
//   Full chart— SVG diagram with pan, pinch/wheel zoom, fit, fullscreen, print
// Rendering is pure: callers pass a ctx with task status and UI state.
// Events are wired in app.js through data-* attributes.

const fcEsc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE_LABEL={start:"Start",action:"Action",decision:"Decision",parallel:"At the same time",escalation:"Escalation",endpoint:"Outcome"};

// ---------- shared helpers ----------
function allGroups(p){const m=new Map();p.chart.rows.forEach(r=>r.forEach(c=>{if(typeof c==="object")m.set(c.group,c);}));return m;}
function rowOf(p,id){for(let i=0;i<p.chart.rows.length;i++){for(const c of p.chart.rows[i]){if(c===id)return i;if(typeof c==="object"&&(c.group===id||c.nodes.includes(id)||c.head===id))return i;}}return -1;}
function incomingLabel(p,id){
  // label of the branch that leads into `id` (e.g. "Yes", "No"), if any
  for(const [nid,n] of Object.entries(p.nodes))for(const c of n.connections||[])if(c.to===id&&c.label)return {label:c.label,from:nid};
  return null;
}
function nodeStatus(node,ctx){
  const tasks=(node.items||[]).map(i=>i.task).filter(Boolean);
  if(!tasks.length||!ctx.sessionActive)return null;
  const st=tasks.map(t=>ctx.taskStatus(t));
  if(st.includes("overdue"))return "overdue";
  if(st.every(s=>s==="done"))return "done";
  if(st.some(s=>s==="done"||s==="progress"||s==="ongoing"))return "active";
  return "todo";
}
const STATUS_TEXT={done:"Done",active:"In progress",overdue:"Overdue",todo:"To do"};
function statusBadge(s){return s&&s!=="todo"?`<span class="fc-status ${s}" aria-label="${STATUS_TEXT[s]}">${s==="done"?"✓":s==="overdue"?"!":s==="active"?"•":""}</span>`:"";}

// ---------- Overview ----------
function ovBox(p,id,ctx,{compact=false}={}){
  const n=p.nodes[id];const s=nodeStatus(n,ctx);const inc=incomingLabel(p,id);
  const body=n.bullets?.length?`<ul>${n.bullets.map(b=>`<li>${fcEsc(b)}</li>`).join("")}</ul>`:`<p>${fcEsc(n.summary)}</p>`;
  return `<button class="ov-box t-${n.type} u-${n.urgency}${n.medicationRefs?" meds":""}${s?` s-${s}`:""}" data-fnode="${id}" aria-label="${fcEsc(n.title)}. ${fcEsc(n.summary)}${s?`. ${STATUS_TEXT[s]}`:""}">
    ${inc&&!compact?`<span class="ov-branch">${fcEsc(inc.label)}</span>`:""}
    <span class="ov-title">${fcEsc(n.title)}${statusBadge(s)}</span>${compact&&n.type!=="decision"?`<p>${fcEsc(n.summary)}</p>`:n.type==="decision"?`<p>${fcEsc(n.summary)}</p>`:body}
  </button>`;
}
function renderOverview(p,ctx,{compact=false}={}){
  return `<div class="ov${compact?" compact":""}">${p.chart.rows.map((row,i)=>{
    const cells=row.map(c=>{
      if(typeof c==="string")return ovBox(p,c,ctx,{compact});
      const head=c.head?p.nodes[c.head]:null;const hs=head?nodeStatus(head,ctx):null;
      return `<div class="ov-group${c.nodes.length>2?" many":""}" role="group" aria-label="${fcEsc(c.label)}">
        <button class="ov-group-head" data-fnode="${c.head||c.nodes[0]}">${fcEsc(c.label)}${statusBadge(hs)}</button>
        <div class="ov-group-cells n${c.nodes.length}">${c.nodes.map(id=>ovBox(p,id,ctx,{compact:true})).join("")}</div></div>`;
    }).join("");
    const arrow=i<p.chart.rows.length-1?`<div class="ov-arrow" aria-hidden="true">${row.length===1&&p.nodes[row[0]]?.type==="decision"?"↙ ↘":"↓"}</div>`:"";
    return `<div class="ov-row n${row.length}">${cells}</div>${arrow}`;
  }).join("")}</div>`;
}

// ---------- Guided ----------
function stepOfNode(p,id){return p.steps.findIndex(s=>s.nodes.includes(id));}
function itemHTML(p,nid,item,i,ctx){
  if(item.med)return `<button class="g-med" data-med-id="${item.med}"><span aria-hidden="true">Rx</span>${fcEsc(item.text)}<b aria-hidden="true">›</b></button>`;
  if(item.pathway)return `<button class="g-med path" data-fpath="${item.pathway}"><span aria-hidden="true">→</span>${fcEsc(item.text)}<b aria-hidden="true">›</b></button>`;
  let on,key;
  if(item.task&&ctx.sessionActive){const st=ctx.taskStatus(item.task);on=st==="done"||st==="ongoing";key=`task:${item.task}`;}
  else{key=`local:${p.id}:${nid}:${i}`;on=ctx.localChecks.has(key);}
  const overdue=item.task&&ctx.sessionActive&&ctx.taskStatus(item.task)==="overdue";
  return `<button class="g-check${on?" on":""}${overdue?" overdue":""}" role="checkbox" aria-checked="${on}" data-gcheck="${key}"><span class="box" aria-hidden="true">${on?"✓":""}</span><span>${fcEsc(item.text)}${overdue?` <em>overdue</em>`:""}</span></button>`;
}
function nodeBlock(p,nid,ctx){
  const n=p.nodes[nid];
  const items=(n.items||[]).map((it,i)=>itemHTML(p,nid,it,i,ctx)).join("");
  if(!items)return `<button class="g-info" data-fnode="${nid}"><strong>${fcEsc(n.title)}</strong><span>${fcEsc(n.summary)}</span></button>`;
  return `<div class="g-node"><button class="g-node-head" data-fnode="${nid}"><span>${fcEsc(n.title)}</span><i aria-hidden="true">i</i></button>${items}</div>`;
}
function renderGuided(p,ctx){
  const k=Math.min(ctx.step??0,p.steps.length-1);const step=p.steps[k];
  const branch=ctx.branch;
  const dec=step.decision?p.nodes[step.decision]:null;
  const branchBtns=dec?`<div class="g-question"><p>${fcEsc(dec.title)}</p><span>${fcEsc(dec.summary)}</span><div class="g-branches">${dec.connections.map(c=>{const t=p.nodes[c.to]||{};const cls=t.type==="escalation"||stepOfNode(p,c.to)>=0&&p.steps[stepOfNode(p,c.to)].escalation?"bad":t.type==="endpoint"?"good":"";return `<button class="g-branch ${cls}${branch===c.to?" chosen":""}" data-gbranch="${c.to}"><strong>${fcEsc(c.label)}</strong><span>${fcEsc(t.title||"Next")}</span></button>`;}).join("")}</div></div>`:"";
  // A chosen branch whose target is not its own step (e.g. "Controlled") is shown inline here.
  const inline=branch&&p.nodes[branch]&&stepOfNode(p,branch)<0?(()=>{const t=p.nodes[branch];return `<div class="g-outcome t-${t.type}">${nodeBlock(p,branch,ctx)}${(t.connections||[]).map(c=>`<button class="g-branch bad" data-gbranch="${c.to}"><strong>${fcEsc(c.label||"Next")}</strong><span>${fcEsc(p.nodes[c.to]?.title||"")}</span></button>`).join("")}</div>`;})():"";
  const body=step.nodes.filter(id=>id!==step.decision||(p.nodes[id].items||[]).length).map(id=>nodeBlock(p,id,ctx)).join("");
  return `<div class="g">
    <div class="g-progress"><span>Step ${k+1} of ${p.steps.length}</span><div class="bar"><i style="width:${Math.round((k+1)/p.steps.length*100)}%"></i></div></div>
    <p class="g-mode-note">${ctx.sessionActive?"Checks update the action cards and timeline.":"Reference mode — checks stay on this screen only."}</p>
    ${p.steps.map((s,i)=>{
      if(i===k)return `<section class="g-step current${s.escalation?" esc":""}" aria-current="step">
        <h3><span class="num">${i+1}</span>${fcEsc(s.title)}</h3>
        ${s.parallel?`<p class="g-parallel">All at the same time — not in order</p>`:""}
        ${body}${branchBtns}${inline}
        ${i<p.steps.length-1&&!dec?`<button class="g-next" data-gstep="${i+1}"><span aria-hidden="true">✓</span> Done → Next step</button>`:""}
      </section>`;
      return `<button class="g-step row${i<k?" past":""}${s.escalation?" esc":""}" data-gstep="${i}"><span class="num">${i<k?"✓":i+1}</span><span>${fcEsc(s.title)}</span><b aria-hidden="true">›</b></button>`;
    }).join("")}
  </div>`;
}

// ---------- Full chart (SVG) ----------
const FC_W=600,FC_GAP=14,FC_ROWGAP=46,FC_PAD=16;
function fcWrap(text,maxChars){const words=String(text||"").split(/\s+/);const lines=[];let cur="";for(const w of words){if((cur+" "+w).trim().length>maxChars&&cur){lines.push(cur);cur=w;}else cur=(cur+" "+w).trim();}if(cur)lines.push(cur);return lines;}
function boxSize(n,width){
  const tl=fcWrap(n.title,Math.floor(width/9.6)),sl=fcWrap(n.summary,Math.floor(width/7.4));
  return {tl,sl,h:18+tl.length*19+sl.length*16+12};
}
function renderChartSVG(p,ctx){
  const place={};let y=FC_PAD;const parts=[];const groupsDrawn=[];
  p.chart.rows.forEach(row=>{
    const cellW=(FC_W-FC_PAD*2-FC_GAP*(row.length-1))/row.length;let x=FC_PAD;let rowH=0;const pending=[];
    row.forEach(c=>{
      if(typeof c==="string"){const n=p.nodes[c];const sz=boxSize(n,cellW);pending.push({kind:"node",id:c,x,w:cellW,sz});rowH=Math.max(rowH,sz.h);}
      else{
        const inner=c.nodes.length;const iw=(cellW-12-8*(inner-1))/inner;const sizes=c.nodes.map(id=>boxSize(p.nodes[id],iw));
        const ih=Math.max(...sizes.map(s=>s.h));const gh=34+ih+10;
        pending.push({kind:"group",g:c,x,w:cellW,iw,sizes,ih,h:gh});rowH=Math.max(rowH,gh);
      }
      x+=cellW+FC_GAP;
    });
    pending.forEach(it=>{
      if(it.kind==="node"){const h=it.sz.h;place[it.id]={x:it.x,y,w:it.w,h};parts.push(drawNode(p,it.id,it.x,y,it.w,h,it.sz,ctx));}
      else{
        place[it.g.group]={x:it.x,y,w:it.w,h:it.h};
        const head=it.g.head?p.nodes[it.g.head]:null;
        groupsDrawn.push(`<g class="svg-group" ${it.g.head?`data-fnode="${it.g.head}" role="button" tabindex="0" aria-label="${fcEsc(it.g.label)}"`:""}><rect x="${it.x}" y="${y}" width="${it.w}" height="${it.h}" rx="14" class="grp"/><rect x="${it.x}" y="${y}" width="${it.w}" height="28" rx="14" class="grp-head"/><rect x="${it.x}" y="${y+14}" width="${it.w}" height="14" class="grp-head"/><text x="${it.x+it.w/2}" y="${y+19}" class="grp-label" text-anchor="middle">${fcEsc(it.g.label)}${head?" ⓘ":""}</text></g>`);
        let ix=it.x+6;it.g.nodes.forEach((id,k)=>{place[id]={x:ix,y:y+34,w:it.iw,h:it.ih};parts.push(drawNode(p,id,ix,y+34,it.iw,it.ih,it.sizes[k],ctx));ix+=it.iw+8;});
      }
    });
    y+=rowH+FC_ROWGAP;
  });
  const H=y-FC_ROWGAP+FC_PAD;
  // edges
  const edges=[];
  const add=(from,c)=>{const a=place[from],b=place[c.to];if(!a||!b)return;
    const sameRow=Math.abs(a.y-b.y)<2;
    if(sameRow){const left=a.x<b.x;const x1=left?a.x+a.w:a.x,x2=left?b.x:b.x+b.w,yy=a.y+Math.min(a.h,b.h)/2;
      edges.push(`<path d="M${x1} ${yy} L${x2} ${yy}" class="edge" marker-end="url(#arr)"/>`);if(c.label)edges.push(edgeLabel((x1+x2)/2,yy-8,c.label,c.label));return;}
    const x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,my=y1+(y2-y1)/2;
    edges.push(`<path d="M${x1} ${y1} L${x1} ${my} L${x2} ${my} L${x2} ${y2-2}" class="edge" marker-end="url(#arr)"/>`);
    if(c.label)edges.push(edgeLabel(x2,my+15,c.label,c.label));
  };
  Object.entries(p.nodes).forEach(([id,n])=>(n.connections||[]).forEach(c=>add(id,c)));
  allGroups(p).forEach(g=>(g.connections||[]).forEach(c=>add(g.group,c)));
  return {W:FC_W,H,svg:`<svg viewBox="0 0 ${FC_W} ${H}" width="${FC_W}" height="${H}" class="fc-svg" role="img" aria-label="${fcEsc(p.title)} full algorithm" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
    ${groupsDrawn.join("")}${edges.join("")}${parts.join("")}</svg>`};
}
function edgeLabel(x,y,text,kind){const w=Math.max(34,text.length*7.4+16);const cls=/^yes/i.test(kind)?"yes":/^no/i.test(kind)?"no":"";return `<g class="edge-label ${cls}"><rect x="${x-w/2}" y="${y-13}" width="${w}" height="20" rx="10"/><text x="${x}" y="${y+1}" text-anchor="middle">${fcEsc(text)}</text></g>`;}
function drawNode(p,id,x,y,w,h,sz,ctx){
  const n=p.nodes[id];const s=nodeStatus(n,ctx);
  const shape=n.type==="decision"
    ?`<path d="M${x+18} ${y} H${x+w-18} L${x+w} ${y+h/2} L${x+w-18} ${y+h} H${x+18} L${x} ${y+h/2} Z" class="nb"/>`
    :`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" class="nb"/>`;
  let ty=y+24;const t=sz.tl.map(l=>{const r=`<text x="${x+w/2}" y="${ty}" class="nt" text-anchor="middle">${fcEsc(l)}</text>`;ty+=19;return r;}).join("");
  ty+=2;const sm=sz.sl.map(l=>{const r=`<text x="${x+w/2}" y="${ty}" class="ns" text-anchor="middle">${fcEsc(l)}</text>`;ty+=16;return r;}).join("");
  const badge=s&&s!=="todo"?`<g class="svg-status ${s}"><circle cx="${x+w-12}" cy="${y+12}" r="9"/><text x="${x+w-12}" y="${y+16}" text-anchor="middle">${s==="done"?"✓":s==="overdue"?"!":"•"}</text></g>`:"";
  return `<g class="svg-node t-${n.type} u-${n.urgency}${n.medicationRefs?" meds":""}" data-fnode="${id}" role="button" tabindex="0" aria-label="${fcEsc(n.title)}. ${fcEsc(n.summary)}${s?`. ${STATUS_TEXT[s]}`:""}">${shape}${t}${sm}${badge}</g>`;
}
function renderChart(p,ctx){
  const {svg}=renderChartSVG(p,ctx);
  return `<div class="fc-tools" role="toolbar" aria-label="Chart controls">
      <button data-zoom="in" aria-label="Zoom in">＋</button><button data-zoom="out" aria-label="Zoom out">−</button>
      <button data-zoom="fit">Fit</button><button data-zoom="full" aria-label="Fullscreen">⛶</button><button data-zoom="print">Print / PDF</button>
    </div>
    <div class="fc-viewport" tabindex="0" aria-label="Full algorithm. Drag to pan, pinch or use the buttons to zoom.">${svg}</div>
    <p class="fc-hint">Drag to pan · pinch or ＋/− to zoom · tap a box for details</p>`;
}

// ---------- pan / zoom ----------
function mountChart(root,saved){
  const vp=root.querySelector(".fc-viewport");const svg=vp?.querySelector("svg");if(!svg)return null;
  const W0=+svg.getAttribute("width"),H0=+svg.getAttribute("height");
  let s=1,tx=0,ty=0;const pts=new Map();let moved=false,start=null,pinch=null;
  const apply=()=>{svg.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;};
  const fit=()=>{const r=vp.getBoundingClientRect();s=Math.min(r.width/W0,1.6);tx=(r.width-W0*s)/2;ty=0;vp.style.height=Math.min(Math.max(H0*s+8,280),window.innerHeight*0.78)+"px";apply();};
  const zoomAt=(f,cx,cy)=>{const ns=Math.min(4,Math.max(0.3,s*f));tx=cx-(cx-tx)*(ns/s);ty=cy-(cy-ty)*(ns/s);s=ns;apply();};
  svg.style.transformOrigin="0 0";svg.style.width=W0+"px";svg.style.height=H0+"px";
  vp.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={x:e.clientX,y:e.clientY,tx,ty};if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s};}});
  const onMove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const r=vp.getBoundingClientRect();const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((pinch.s*d/pinch.d)/s,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);moved=true;return;}
    if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){tx=start.tx+dx;ty=start.ty+dy;apply();}}};
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)start=null;};
  window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);
  vp.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  vp.addEventListener("keydown",e=>{const r=vp.getBoundingClientRect();if(e.key==="+"||e.key==="=")zoomAt(1.2,r.width/2,r.height/2);if(e.key==="-")zoomAt(1/1.2,r.width/2,r.height/2);if(e.key==="0")fit();
    const step=40;if(e.target===vp){if(e.key==="ArrowLeft"){tx+=step;apply();}if(e.key==="ArrowRight"){tx-=step;apply();}if(e.key==="ArrowUp"){ty+=step;apply();e.preventDefault();}if(e.key==="ArrowDown"){ty-=step;apply();e.preventDefault();}}});
  // Restore the previous pan/zoom after a re-render (e.g. a timer firing), else fit to width.
  if(saved){s=saved.s;tx=saved.tx;ty=saved.ty;vp.style.height=saved.h;apply();}else fit();
  let lastW=vp.parentElement.getBoundingClientRect().width;
  const ro=new ResizeObserver(()=>{const w=vp.parentElement.getBoundingClientRect().width;if(Math.abs(w-lastW)>2){lastW=w;fit();}});ro.observe(vp.parentElement);
  return {
    zoom(d){const r=vp.getBoundingClientRect();zoomAt(d==="in"?1.25:1/1.25,r.width/2,r.height/2);},
    fit,
    state(){return {s,tx,ty,h:vp.style.height};},
    full(){const host=root;if(document.fullscreenElement){document.exitFullscreen();return;}
      if(host.requestFullscreen){host.requestFullscreen().then(()=>setTimeout(fit,120)).catch(()=>{host.classList.toggle("fc-pseudo-full");setTimeout(fit,50);});}
      else{host.classList.toggle("fc-pseudo-full");setTimeout(fit,50);}},
    destroy(){ro.disconnect();window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);}
  };
}

const DEFAULT_KEY = "ob-emergency-assist.session.v1";
const SCHEMA_VERSION = "1.0";

function clone(value){ return value == null ? value : JSON.parse(JSON.stringify(value)); }

function createLocalSessionStore({key=DEFAULT_KEY,storage=globalThis.localStorage}={}){
  const listeners = new Set();
  const read = () => {
    try {
      const saved = JSON.parse(storage.getItem(key) || "null");
      if(!saved) return null;
      if(!Number.isInteger(saved.revision)) saved.revision = 0;
      if(!saved.schemaVersion) saved.schemaVersion = SCHEMA_VERSION;
      if(!Array.isArray(saved._actionEvents)) saved._actionEvents = [];
      return saved;
    }
    catch { return null; }
  };
  const write = value => storage.setItem(key, JSON.stringify(value));
  const emit = value => listeners.forEach(fn => fn(clone(value)));

  return {
    createSession(seed){
      const session = {
        ...clone(seed), schemaVersion:SCHEMA_VERSION, revision:0,
        _actionEvents:[{
          eventId:`created-${seed.id}`, sessionId:seed.id, taskId:null,
          type:"SESSION_CREATED", status:"active", actor:"local-device",
          occurredAt:new Date().toISOString(), schemaVersion:SCHEMA_VERSION,
          revision:0, simulationTimeMs:seed.mode === "simulation" ? 0 : null
        }]
      };
      write(session); emit(session); return clone(session);
    },
    loadSession(){ return clone(read()); },
    recordAction({event,nextState,expectedRevision}){
      const current = read();
      if(!current) return {applied:false,missing:true,session:null};
      const prior = current._actionEvents || [];
      if(prior.some(x => x.eventId === event.eventId)) return {applied:false,duplicate:true,session:clone(current)};
      if(expectedRevision !== current.revision || event.revision !== current.revision + 1) return {applied:false,conflict:true,session:clone(current)};
      const normalized = {
        eventId:event.eventId, sessionId:current.id, taskId:event.taskId ?? null,
        type:event.type, status:event.status ?? null, actor:event.actor || "local-device",
        occurredAt:event.occurredAt || new Date().toISOString(), schemaVersion:SCHEMA_VERSION,
        revision:event.revision, simulationTimeMs:event.simulationTimeMs ?? null,
        payload:clone(event.payload || {})
      };
      const saved = {...clone(nextState),schemaVersion:SCHEMA_VERSION,revision:normalized.revision,_actionEvents:[...prior,normalized]};
      write(saved); emit(saved); return {applied:true,session:clone(saved),event:clone(normalized)};
    },
    subscribe(listener){ listeners.add(listener); return () => listeners.delete(listener); },
    replaceAuthoritative(nextState){ write(clone(nextState)); emit(nextState); return clone(nextState); },
    clear(){ storage.removeItem(key); emit(null); }
  };
}

// Client adapter for the optional Apps Script build. The Netlify release does not use this file.
function createWorkspaceSessionStore({key="ob-emergency-assist.session.v1",pollMs=3000}={}){
  const local=createLocalSessionStore({key});
  let activeSessionId=null,pollHandle=null;
  const call=(name,...args)=>new Promise((resolve,reject)=>{
    if(!globalThis.google?.script?.run){reject(new Error("google.script.run unavailable"));return;}
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
  });
  const mergeAuthoritative=remote=>{
    if(!remote)return null;
    const privateState=local.loadSession()||{};
    if(Number(remote.revision||0)<Number(privateState.revision||0))return privateState;
    const merged={...privateState,...remote,events:privateState.events||[],doseCounts:privateState.doseCounts||{},_actionEvents:privateState._actionEvents||[]};
    return local.replaceAuthoritative(merged);
  };
  const coordinationSnapshot=session=>{
    const clean=JSON.parse(JSON.stringify(session));
    delete clean._actionEvents;delete clean.events;delete clean.doseCounts;
    clean.timers=(clean.timers||[]).map(({medId,...timer})=>timer);
    return clean;
  };
  const coordinationEvent=event=>event.type==="MEDICATION_ADMINISTERED"?{...event,type:"TASK_UPDATED",payload:{coordinationOnly:true}}:event;
  const beginPolling=()=>{
    clearInterval(pollHandle);
    if(!activeSessionId)return;
    pollHandle=setInterval(async()=>{
      try{
        const current=local.loadSession(),result=await call("pollSession",activeSessionId,current?.revision||0);
        if(result?.changed&&result.session)mergeAuthoritative(result.session);
      }catch{/* Local emergency screen remains usable while sync is unavailable. */}
    },pollMs);
  };
  return {
    createSession(seed){
      const created=local.createSession(seed);activeSessionId=created.id;beginPolling();
      call("createSession",coordinationSnapshot(created)).then(r=>r?.session&&mergeAuthoritative(r.session)).catch(()=>{});
      return created;
    },
    loadSession(){const s=local.loadSession();activeSessionId=s?.id||null;beginPolling();return s;},
    recordAction(input){
      const result=local.recordAction(input);
      if(result.applied){
        call("recordAction",coordinationEvent(result.event),coordinationSnapshot(result.session),input.expectedRevision)
          .then(r=>r?.session&&mergeAuthoritative(r.session)).catch(()=>{});
      }
      return result;
    },
    subscribe(listener){return local.subscribe(listener);},
    clear(){activeSessionId=null;clearInterval(pollHandle);local.clear();}
  };
}

function hydrateSession(s){
  if(!s) return null;
  if(s.status==="active" && s.mode==="clinical" && s.running) s.elapsedBase += Math.max(0,Date.now()-s.lastSavedAt);
  s.lastSavedAt=Date.now();
  return s;
}
function saveSession(action={}){
  if(!session){store.clear();return true;}
  const now=Date.now();
  const next=JSON.parse(JSON.stringify(session));
  if(next.running){next.elapsedBase=currentElapsed();next.lastTickAt=now;}
  next.lastSavedAt=now;
  const expectedRevision=session.revision||0;
  suppressStoreNotification=true;
  const result=store.recordAction({
    expectedRevision,nextState:next,
    event:{
      eventId:action.eventId||uid(),sessionId:session.id,taskId:action.taskId||null,
      type:action.type||"STATE_SAVED",status:action.status||null,
      actor:action.actor||"local-device",occurredAt:new Date().toISOString(),
      schemaVersion:"1.0",revision:expectedRevision+1,
      simulationTimeMs:session.mode==="simulation"?currentElapsed():null,
      payload:action.payload||{}
    }
  });
  suppressStoreNotification=false;
  if(result.conflict){session=hydrateSession(result.session);toast("Session changed; latest state restored","alert");return false;}
  if(result.session)session=result.session;
  return !!result.applied;
}

function fmt(ms,includeHours=false){
  ms=Math.max(0,ms); const total=Math.floor(ms/1000),s=total%60,m=Math.floor(total/60)%60,h=Math.floor(total/3600);
  return (includeHours||h?`${String(h).padStart(2,"0")}:`:"")+`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function currentElapsed(){

// Overdue items are never hidden behind a tap. Task-linked reminders show on

function renderAlertStrip(){
  const due=getDueTimers().filter(t=>!t.taskId).sort((a,b)=>a.dueAt-b.dueAt);

  return `<section class="alert-strip" role="alert">

// Full cards: overdue tasks (DUE NOW) and the first open pathway group.

function renderTaskGroups(e){
  const groups=[...new Set(e.tasks.map(t=>t.group))];

  return groups.map(group=>{
    const items=e.tasks.filter(t=>t.group===group && taskState(t.id).status!=="done" && !overdueTimerFor(t.id));
    if(!items.length)return "";

    return `<div class="task-group${primary?" primary-group":" compact-group"}">${primary?"":`<h2>${esc(group)}</h2>`}${items.map(t=>primary?renderTaskCard(t):expandedTask===t.id?renderTaskCard(t,true):renderTaskRow(t)).join("")}</div>`;

  const st=taskState(t.id);

function taskStatusHTML(t,st){
  const overdue=overdueTimerFor(t.id);
  if(overdue)return `<span class="task-status overdue">${overdueSpan(overdue)}</span>`;
  const next=session.timers.find(x=>x.taskId===t.id&&!x.cancelled&&!x.ack);

  if(st.status==="progress")parts.push("In progress");

  if(next)parts.push(`Next in <span class="live-countdown" data-due-at="${next.dueAt}">${formatCountdown(next)}</span>`);

function renderTaskCard(t,expandedRow=false){
  const st=taskState(t.id);

  // secondary link so the team can still see who is working on what.
  const primaryAction=t.type==="ongoing"&&st.status==="todo"?"ongoing":"done";
  const primaryLabel=primaryAction==="ongoing"?"Ongoing":t.type==="repeat"?"Assessed":t.type==="med"?"Record dose":"Done";

  const tag=overdue?"DUE NOW":expandedRow?"":esc(t.group);
  return `<article class="task-card ${t.priority} ${st.status}${overdue?" is-overdue":""}${expandedRow?" expanded-row":""}" id="card-${t.id}">

function handleTask(taskId,action){
  const e=EMERGENCIES[session.emergencyId],t=e.tasks.find(x=>x.id===taskId); if(!t)return;
  const at=currentElapsed();
  if(action==="start"){session.tasks[taskId]={status:"progress",startedAt:at};logEvent(`Started: ${t.title}`,"task");}
  if(action==="ongoing"){session.tasks[taskId]={status:"ongoing",startedAt:at};logEvent(`Ongoing: ${t.title}`,"task");}
  if(action==="done"&&t.type==="med"){openMedicationChooser(t);return;}
  if(action==="done"){
    session.tasks[taskId]={...taskState(taskId),status:t.type==="ongoing"?"ongoing":"done",completedAt:at};
    logEvent(`${t.type==="repeat"?"Assessed":"Completed"}: ${t.title}`,"task");
    cancelTaskTimers(taskId);
    if(t.type==="repeat"&&t.repeatMin) addTimer({taskId,label:t.title,dueAt:sessionMinute()+t.repeatMin,kind:"repeat"});
  }
  if(action==="reopen"){session.tasks[taskId]={status:"todo"};cancelTaskTimers(taskId);logEvent(`Reopened: ${t.title}`,"task");}
  if(action==="done"||action==="reopen")expandedTask=null;
  const type={start:"TASK_STARTED",ongoing:"TASK_MARKED_ONGOING",done:t.type==="repeat"?"ASSESSMENT_RECORDED":"TASK_COMPLETED",reopen:"TASK_REOPENED"}[action]||"TASK_UPDATED";
  saveSession({type,taskId,status:session.tasks[taskId]?.status||null});render();
}

function cancelTaskTimers(taskId){session.timers.forEach(t=>{if(t.taskId===taskId)t.cancelled=true;});}
function addTimer(timer){session.timers.push({id:uid(),createdAt:sessionMinute(),createdAtWall:new Date().toISOString(),dueAtElapsedMs:timer.dueAt*60000,ack:false,cancelled:false,...timer});}
function logEvent(text,type="note"){session.events.unshift({id:uid(),at:currentElapsed(),type,text});}
function formatEventTime(ms){return fmt(ms,true);}
function formatCountdown(t){return fmt(Math.max(0,(t.dueAt-sessionMinute())*60000));}
// Every time shown in a session is on the elapsed-time clock. Labels say which
// is which: "due at" = elapsed time it fell due; "overdue"/"in" = distance from now.
function formatDue(t){return t.dueAt<=sessionMinute()?`Due at ${fmt(t.dueAt*60000)} elapsed · overdue ${fmt((sessionMinute()-t.dueAt)*60000)}`:`Due at ${fmt(t.dueAt*60000)} elapsed · in ${formatCountdown(t)}`;}

function getDueTimers(){return session?session.timers.filter(t=>!t.cancelled&&!t.ack&&t.dueAt<=sessionMinute()):[];}
function getFutureEvents(){
  if(!session)return[];
  const e=EMERGENCIES[session.emergencyId];
  const timerEvents=session.timers.filter(t=>!t.cancelled&&!t.ack&&t.dueAt>sessionMinute()).map(t=>({at:t.dueAt,label:t.label}));
  const milestones=e.milestones.filter(m=>!session.firedMilestones.includes(m.min)&&m.min>sessionMinute()).map(m=>({at:m.min,label:m.label}));
  return [...timerEvents,...milestones].sort((a,b)=>a.at-b.at);
}
function nextDueLabel(){return statusLineHTML();}

function startClock(){
  clearInterval(clockHandle); if(!session||session.status!=="active")return;
  session.lastTickAt=Date.now();
  clockHandle=setInterval(()=>{updateClockDom();checkMilestones();checkDueTransitions();},500);
}
function updateClockDom(){
  if(!session)return;
  const now=sessionMinute();
  const c=$("#elapsedClock"); if(c)c.textContent=fmt(currentElapsed());
  $$(".live-elapsed").forEach(el=>{el.textContent=fmt(currentElapsed());});
  $$(".live-overdue").forEach(el=>{el.textContent=`overdue ${fmt((now-Number(el.dataset.dueAt))*60000)}`;});
  $$(".live-countdown").forEach(el=>{el.textContent=fmt((Number(el.dataset.dueAt)-now)*60000);});
}
function freezeClock(){
  if(session?.running){session.elapsedBase=currentElapsed();session.running=false;session.lastTickAt=Date.now();session.simulationTimeMs=session.mode==="simulation"?session.elapsedBase:null;saveSession({type:"SESSION_PAUSED",status:"active"});}
}
function resumeClock(){if(session&&!session.running){session.running=true;session.lastTickAt=Date.now();saveSession({type:"SESSION_RESUMED",status:"active"});}}
function advanceSimulation(min){
  if(session.mode!=="simulation")return;
  if(session.running){session.elapsedBase=currentElapsed();session.lastTickAt=Date.now();}
  session.elapsedBase+=min*60000;session.simulationTimeMs=session.elapsedBase;logEvent(`Simulation time advanced +${Number(min).toFixed(min%1?1:0)} min`,"simulation");saveSession({type:"SIMULATION_TIME_ADVANCED",status:"active",payload:{minutes:min,simulationTimeMs:session.simulationTimeMs}});checkMilestones();render();
}
function jumpNext(){
  const next=getFutureEvents()[0];
  if(!next){toast("No future timer or milestone");return;}
  const delta=Math.max(0,next.at-sessionMinute());advanceSimulation(delta);
}
function checkMilestones(){
  if(!session)return; const e=EMERGENCIES[session.emergencyId],now=sessionMinute();
  let latest=null;
  e.milestones.forEach(m=>{
    if(now>=m.min&&!session.firedMilestones.includes(m.min)){
      session.firedMilestones.push(m.min);addTimer({label:m.label,dueAt:m.min,kind:"milestone",message:m.message});logEvent(`${m.label}: ${m.message}`,"milestone");latest=m;
    }
  });
  // The alert strip already shows the milestone; the toast only names it.
  if(latest){playAlert();toast(`${latest.label} due`,"alert");lastDueCount=getDueTimers().length;saveSession({type:"MILESTONE_FIRED",status:"pending",payload:{minute:latest.min,label:latest.label}});}
}
let lastDueCount=0;
function checkDueTransitions(){
  const due=getDueTimers();let changed=false;
  due.forEach(t=>{
    if(t.kind==="repeat"&&t.taskId&&!t.reactivated){t.reactivated=true;session.tasks[t.taskId]={status:"todo",dueAt:currentElapsed()};logEvent(`Reassessment due: ${t.label}`,"timer");changed=true;}
  });
  if(due.length>lastDueCount){playAlert();changed=true;}
  if(changed){saveSession({type:"TIMER_DUE",status:"pending",payload:{timerIds:due.map(t=>t.id)}});render();}
  lastDueCount=due.length;
}

function ensureAudio(){
  try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)(); if(audioContext.state==="suspended")audioContext.resume();}catch{}
}
function playAlert(){
  if(!session?.sound)return;ensureAudio();if(!audioContext)return;
  [0,.18].forEach((delay,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type="sine";o.frequency.value=i?740:620;g.gain.setValueAtTime(.0001,audioContext.currentTime+delay);g.gain.exponentialRampToValueAtTime(.16,audioContext.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+delay+.16);o.connect(g).connect(audioContext.destination);o.start(audioContext.currentTime+delay);o.stop(audioContext.currentTime+delay+.18);});
  if(navigator.vibrate)navigator.vibrate([180,80,180]);
}

  const cockpit=document.body.classList.contains("in-cockpit");
  if(cockpit)$("#toastRegion").replaceChildren();
  const el=document.createElement("div");el.className=`toast ${type}`;el.textContent=message;$("#toastRegion").appendChild(el);setTimeout(()=>el.remove(),cockpit?2600:4200);
}
function confirmAction(title,text,onConfirm){
  const tpl=$("#confirmTemplate").content.cloneNode(true),card=tpl.querySelector(".confirm-card");card.querySelector("h2").textContent=title;card.querySelector("p").textContent=text;openSheet({eyebrow:"CONFIRM",title:"",html:""});$("#sheetBody").replaceChildren(card);card.addEventListener("click",e=>{if(e.target.dataset.confirm==="cancel")closeSheet();if(e.target.dataset.confirm==="yes"){closeSheet();onConfirm();}});
}
function endSession(){
  confirmAction("End this assist session?","This stops all alerts. The timeline will be cleared when you leave this session.",()=>{clearInterval(clockHandle);freezeClock();session.status="ended";saveSession({type:"SESSION_ENDED",status:"ended"});openSheet({eyebrow:"SESSION ENDED",title:`Elapsed ${fmt(currentElapsed(),true)}`,html:`<p class="lead">Ending the app session does not label the clinical emergency resolved.</p><button class="button secondary full" data-action="show-timeline">View timeline</button><button class="button primary full" data-action="clear-session">Return to emergency home</button>`});render();});
}
function clearSession(){session=null;store.clear();selectedEmergency=null;closeSheet();navigate("emergency");}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,a");if(!b)return;
  if(b.dataset.nav)navigate(b.dataset.nav);
  if(b.dataset.navJump)navigate(b.dataset.navJump);
  if(b.dataset.emergency){selectedEmergency=b.dataset.emergency;render();}
  if(b.dataset.education)openEducation(b.dataset.education);
  if(b.dataset.medId)openMedication(b.dataset.medId);
  if(b.dataset.taskInfo)openTaskInfo(b.dataset.emergencyId,b.dataset.taskInfo);
  if(b.dataset.taskAction)handleTask(b.dataset.taskId,b.dataset.taskAction);
  if(b.dataset.flowSelect){flowEmergency=b.dataset.flowSelect;renderFlowcharts();}
  if(b.dataset.fview){flowView=b.dataset.fview;renderFlowcharts();}
  if(b.dataset.fpath){closeSheet();flowEmergency=b.dataset.fpath;navigate("flowcharts");}
  if(b.dataset.gstep!=null){guidedStep[flowEmergency]=Number(b.dataset.gstep);guidedBranch[flowEmergency]=null;renderFlowcharts();requestAnimationFrame(()=>$(".g-step.current")?.scrollIntoView({block:"nearest",behavior:"smooth"}));}
  if(b.dataset.gbranch){const p=PATHWAYS[flowEmergency],to=b.dataset.gbranch;const k=p.steps.findIndex(st=>st.nodes.includes(to));if(k>=0){guidedStep[flowEmergency]=k;guidedBranch[flowEmergency]=null;}else guidedBranch[flowEmergency]=to;renderFlowcharts();requestAnimationFrame(()=>$(".g-step.current")?.scrollIntoView({block:"nearest",behavior:"smooth"}));}
  if(b.dataset.gcheck)guidedCheck(b.dataset.gcheck);
  if(b.dataset.zoom&&chartCtl){const z=b.dataset.zoom;if(z==="print"){document.body.classList.add("print-chart");window.print();setTimeout(()=>document.body.classList.remove("print-chart"),500);}else if(z==="full")chartCtl.full();else if(z==="fit")chartCtl.fit();else chartCtl.zoom(z);}
  if(b.dataset.medFilter){
    $$(".filter-chips button").forEach(x=>x.classList.toggle("active",x===b));
    const input=$("#medSearch");if(input){input.value=b.dataset.medFilter;updateMedicationList(b.dataset.medFilter);}
  }
  if(b.dataset.sim){if(b.dataset.sim==="pause"){session.running?freezeClock():resumeClock();render();}else if(b.dataset.sim==="next")jumpNext();else advanceSimulation(Number(b.dataset.sim));if(!$("#infoSheet").hidden)showSimTime();}
  const a=b.dataset.action;
  if(a==="dismiss-notice"){settings.noticeDismissed=true;saveSettings();$("#clinicalNotice").hidden=true;}
  if(a==="back-home"){selectedEmergency=null;render();}
  if(a==="start-session")startSession(selectedEmergency,b.dataset.mode);
  if(a==="open-flow")openFlow(b.dataset.id);
  if(a==="close-sheet")closeSheet();
  if(a==="sim-time")showSimTime();
  // Wide screens: toggle the side panel. Narrow: open the flowchart in a sheet so the cockpit stays put.
  // Wide: toggle the side overview. Narrow: open the full pathway page (status strip keeps the clock + a way back).
  if(a==="toggle-flow"){if(WIDE.matches){flowOpen=!flowOpen;render();}else{flowEmergency=session.emergencyId;navigate("flowcharts");}}
  if(a==="open-full-flow"){flowEmergency=session.emergencyId;navigate("flowcharts");}
  if(a==="goto-task"){closeSheet();expandedTask=b.dataset.taskId;flowEmergency=session.emergencyId;navigate("emergency");requestAnimationFrame(()=>$(`#card-${b.dataset.taskId}`)?.scrollIntoView({block:"center",behavior:"smooth"}));}
  if(a==="expand-task"){expandedTask=b.dataset.taskId;render();requestAnimationFrame(()=>$(`#card-${expandedTask}`)?.scrollIntoView({block:"nearest",behavior:"smooth"}));}
  if(a==="collapse-task"){expandedTask=null;render();}
  if(a==="toggle-completed"){const l=$("#completedList");l.hidden=!l.hidden;}
  if(a==="toggle-sound"){session.sound=!session.sound;settings.sound=session.sound;saveSettings();ensureAudio();saveSession();render();}
  if(a==="show-timers")showTimers();
  if(a==="show-timeline")showTimeline();
  if(a==="open-due")showDue(b.dataset.timerId);
  if(a==="ack-timer")acknowledgeTimer(b.dataset.timerId);
  if(a==="record-med")recordMedication(b.dataset.medId);
  if(a==="show-about")showAbout();
  if(a==="end-session")endSession();
  if(a==="clear-session")clearSession();
});

document.addEventListener("input",e=>{if(e.target.id==="medSearch")updateMedicationList(e.target.value);});
$("#sheetBackdrop").addEventListener("click",closeSheet);
// ---------- Header controls ----------
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;});
function applyTextSize(){
  document.documentElement.classList.toggle("text-lg",!!settings.largeText);
  $$("[data-action=toggle-text]").forEach(b=>b.setAttribute("aria-pressed",String(!!settings.largeText)));
  const st=$("#drawerTextState");if(st)st.textContent=settings.largeText?"On":"Off";
}
function openMenu(){const d=$("#menuDrawer");d.hidden=false;$("#drawerBackdrop").hidden=false;requestAnimationFrame(()=>d.classList.add("open"));$("[data-action=open-menu]").setAttribute("aria-expanded","true");$$("#menuDrawer [data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===route));}
function closeMenu(){const d=$("#menuDrawer");d.classList.remove("open");$("[data-action=open-menu]")?.setAttribute("aria-expanded","false");setTimeout(()=>{d.hidden=true;$("#drawerBackdrop").hidden=true;},160);}
async function shareApp(){
  const url=location.origin+location.pathname.replace(/index\.html$/,"");
  const data={title:"OB Emergency Assist",text:"Phone-first OB emergency guidance, timers and simulation.",url};
  if(navigator.share){try{await navigator.share(data);}catch{}return;}
  try{await navigator.clipboard.writeText(url);toast("Link copied");}
  catch{openSheet({eyebrow:"SHARE",title:"Copy this link",html:`<p class="lead">${esc(url)}</p>`});}
}
function installApp(){
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone){toast("Already installed on this device");return;}
  if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;});return;}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  openSheet({eyebrow:"DOWNLOAD APP",title:"Add to your home screen",html:`
    <p class="lead">Installing keeps the app one tap away and available offline after the first load.</p>
    <div class="install-steps ${ios?"":"dim-ios"}"><h3>iPhone / iPad (Safari)</h3><ol><li>Tap the Share button.</li><li>Choose <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol></div>
    <div class="install-steps"><h3>Android (Chrome)</h3><ol><li>Tap the ⋮ menu.</li><li>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ol></div>
    <div class="install-steps"><h3>Laptop (Chrome / Edge)</h3><ol><li>Click the install icon in the address bar, or the browser menu → <strong>Install</strong>.</li></ol></div>`});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
  if(a==="open-menu")openMenu();
  if(a==="close-menu")closeMenu();
  if(a==="toggle-text"){settings.largeText=!settings.largeText;saveSettings();applyTextSize();toast(settings.largeText?"Larger text on":"Larger text off");}
  if(a==="share"){closeMenu();shareApp();}
  if(a==="install"){closeMenu();installApp();}
  if(a==="show-about"&&!$("#menuDrawer").hidden)closeMenu();
});
document.addEventListener("click",e=>{const b=e.target.closest("#menuDrawer [data-nav], #menuDrawer a");if(b)closeMenu();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#menuDrawer").hidden)closeMenu();});
applyTextSize();

function updateConnectivity(quiet=false){
  const online=navigator.onLine;$("#connectionDot")?.classList.toggle("offline",!online);const l=$("#connectionLabel");if(l)l.textContent=online?"Ready":"Offline";if(!online&&!quiet)toast("Offline · this device continues locally","alert");
}
window.addEventListener("online",()=>updateConnectivity());window.addEventListener("offline",()=>updateConnectivity());
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session?.status==="active"){checkMilestones();render();}});

updateConnectivity();if(session?.status==="active")startClock();render();
store.subscribe(next=>{
  if(suppressStoreNotification||!next||!session||next.id!==session.id)return;
  if((next.revision||0)>(session.revision||0)){session=hydrateSession(next);render();}
});

// Flowchart nodes: tap or keyboard (SVG groups are not native buttons)
document.addEventListener("click",e=>{const n=e.target.closest("[data-fnode]");if(!n)return;const host=n.closest("[data-pathway]");if(host)openNodeDetail(host.dataset.pathway,n.dataset.fnode);});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const n=e.target.closest?.("g[data-fnode]");if(!n)return;e.preventDefault();const host=n.closest("[data-pathway]");if(host)openNodeDetail(host.dataset.pathway,n.dataset.fnode);});

  </script>

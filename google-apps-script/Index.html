/* =====================================================================
   FLOWCHART ENGINE — Overview · Guided · Full chart (v0.13)
   ===================================================================== */
.acc-crimson{--acc:#c4314b;--acc-soft:#fff1f3}.acc-amber{--acc:#b86e00;--acc-soft:#fff6e3}.acc-violet{--acc:#6a46c2;--acc-soft:#f4f0ff}
.fc-strip{position:sticky;top:60px;z-index:25;display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(11,33,73,.06);min-height:52px}
.fc-strip .mode-tag{font-size:12px}.fc-strip.simulation .mode-tag{background:var(--teal)}
.fc-strip strong{font-size:24px;font-variant-numeric:tabular-nums;color:var(--navy)}
.fc-strip button{margin-left:auto;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:16px;font-weight:800}
.fc-head{display:flex;gap:12px;align-items:center;padding:14px 14px 8px}
.fc-head h1{margin:0 0 8px;font-size:24px;line-height:1.12;color:var(--navy);letter-spacing:-.02em}
.fc-head .em-icon,.fc-head .em-icon img{width:52px;height:52px;border-radius:14px}
.fc-emerg{display:flex;gap:6px;flex-wrap:wrap}
.fc-emerg button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;font-weight:800}
.fc-emerg button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.fc-views{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 12px 10px;padding:4px;border-radius:14px;background:#fff;border:1px solid var(--line);position:sticky;top:60px;z-index:20}
body:has(.fc-strip) .fc-views{top:112px}
.fc-views button{min-height:46px;border:0;border-radius:10px;background:transparent;font-size:16px;font-weight:800;color:var(--navy)}
.fc-views button.active{background:linear-gradient(180deg,#2f6fe0,#1d55c4);color:#fff;box-shadow:0 3px 10px rgba(29,85,196,.25)}
.fc-body{padding:0 12px 6px}
/* Overview */
.ov{display:flex;flex-direction:column;align-items:stretch}
.ov-row{display:grid;gap:8px;grid-template-columns:1fr}
.ov-row.n2{grid-template-columns:1fr 1fr}
.ov-arrow{text-align:center;color:#2b4b7e;font-size:22px;font-weight:900;line-height:1;padding:3px 0}
.ov-box{position:relative;text-align:left;background:#fff;border:1.5px solid #cfd8e6;border-radius:14px;padding:10px 12px;color:var(--ink);box-shadow:0 2px 8px rgba(11,33,73,.04);min-height:56px}
.ov-box ul{margin:4px 0 0;padding-left:18px}.ov-box li,.ov-box p{font-size:16px;line-height:1.35;margin:2px 0 0;color:#34445c}
.ov-title{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;font-size:18px;font-weight:900;line-height:1.2;color:var(--navy)}
.ov-box.t-start{background:var(--acc,#c4314b);border-color:var(--acc,#c4314b);text-align:center;box-shadow:0 6px 16px rgba(120,20,40,.18)}
.ov-box.t-start .ov-title{color:#fff;justify-content:center;font-size:20px}.ov-box.t-start p{color:#fff;opacity:.95}
.ov-box.meds{background:#fff8e6;border-color:#ecc56b}
.ov-box.t-decision{background:#e9f1ff;border:2px solid #2f6fe0;text-align:center;border-radius:18px}.ov-box.t-decision .ov-title{justify-content:center}
.ov-box.t-endpoint{background:#eefaf3;border-color:#93d3ae}.ov-box.t-endpoint .ov-title{color:#17673e}
.ov-box.t-escalation{background:#fff1f3;border-color:#e58c9b}.ov-box.t-escalation .ov-title{color:#a3162d}
.ov-branch{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.04em;color:#fff;background:#2f6fe0;border-radius:6px;padding:1px 8px;margin-bottom:4px}
.t-endpoint .ov-branch{background:#1f8a5b}.t-escalation .ov-branch{background:#b4192f}
.ov-group{border:1.5px solid #a9c1ea;background:#eef4ff;border-radius:16px;padding:0 8px 8px;overflow:hidden}
.ov-group-head{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% + 16px);margin:0 -8px 8px;min-height:40px;border:0;background:#1d3f7a;color:#fff;font-size:15px;font-weight:900;padding:6px 10px}
.ov-group-cells{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ov-group .ov-box{min-height:0;padding:8px 10px}.ov-group .ov-title{font-size:17px}
.fc-status{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:900;color:#fff;background:#9aa8bb}
.fc-status.done{background:#1f8a5b}.fc-status.overdue{background:#b4192f}.fc-status.active{background:#d58b0a}
.ov-box.s-done{opacity:.82}.ov-box.s-overdue{outline:3px solid #e6a1ac}
.ov.compact .ov-title{font-size:16px}.ov.compact .ov-box p,.ov.compact li{font-size:15px}
/* Guided */
.g-progress{display:flex;align-items:center;gap:10px;margin:2px 2px 4px}
.g-progress span{font-size:16px;font-weight:900;color:var(--navy);white-space:nowrap}
.g-progress .bar{flex:1;height:8px;border-radius:99px;background:#dde5f0;overflow:hidden}.g-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fe0,#1d55c4);border-radius:99px}
.g-mode-note{margin:0 2px 8px;font-size:14px;color:var(--muted)}
.g-step{display:block;width:100%;border-radius:16px;margin-bottom:8px}
.g-step.current{background:#fff;border:2px solid #f0b8c2;box-shadow:0 8px 20px rgba(150,20,40,.08);padding:0 0 12px;overflow:hidden}
.g-step.current h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:10px 14px;background:linear-gradient(180deg,#fff0f2,#ffe6ea);font-size:21px;color:#9b1a30}
.acc-amber .g-step.current{border-color:#efcf8a}.acc-amber .g-step.current h3{background:linear-gradient(180deg,#fff8e8,#fff0d2);color:#7a4b00}
.acc-violet .g-step.current{border-color:#cdbdf0}.acc-violet .g-step.current h3{background:linear-gradient(180deg,#f6f2ff,#ece4ff);color:#4b2d9a}
.g-step .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--acc,#c4314b);color:#fff;font-size:17px;font-weight:900}
.g-parallel{margin:0 14px 6px;font-size:15px;font-weight:800;color:#1d55c4}
.g-node{margin:0 10px 6px;border-top:1px solid #f0f2f6;padding-top:4px}
.g-node:first-of-type{border-top:0}
.g-node-head{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:6px 4px;font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#4a5a72;text-align:left}
.g-node-head i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid #cbd6e4;display:grid;place-items:center;font-family:Georgia,serif;text-transform:none;color:var(--navy)}
.g-check{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:52px;padding:10px 8px;border:0;border-bottom:1px solid #eef1f5;background:transparent;text-align:left;font-size:18px;line-height:1.3;color:var(--ink)}
.g-check .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #9aa8bb;display:grid;place-items:center;color:#fff;font-weight:900;margin-top:-1px}
.g-check.on .box{background:#1f8a5b;border-color:#1f8a5b}.g-check.on>span:last-child{color:#4a5a72;text-decoration:line-through;text-decoration-color:#9aa8bb}
.g-check.overdue .box{border-color:#b4192f}.g-check em{font-style:normal;font-size:14px;font-weight:900;color:#b4192f}
.g-med{display:flex;align-items:center;gap:10px;width:calc(100% - 4px);min-height:48px;margin:6px 2px 0;padding:8px 12px;border:1px solid #ecc56b;background:#fff8e6;border-radius:12px;text-align:left;font-size:17px;font-weight:700;color:#5f3c00}
.g-med>span{flex:none;width:30px;height:30px;border-radius:8px;background:#ffe6a8;display:grid;place-items:center;font-weight:900;font-size:13px}
.g-med b{margin-left:auto;font-size:22px;color:#a87a1a}
.g-med.path{border-color:#a9c1ea;background:#eef4ff;color:#1d3f7a}.g-med.path>span{background:#d7e4fb}
.g-info{display:flex;flex-direction:column;gap:2px;width:calc(100% - 20px);margin:6px 10px 0;padding:10px 12px;border:1px solid #d9cff3;background:#f7f3ff;border-radius:12px;text-align:left}
.g-info strong{font-size:18px;color:#4b2d9a}.g-info span{font-size:16px;color:#34445c}
.g-question{margin:6px 12px 0}.g-question p{margin:0;font-size:22px;font-weight:900;color:var(--navy);text-align:center}.g-question>span{display:block;text-align:center;font-size:16px;color:var(--muted);margin:2px 0 10px}
.g-branches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-branch{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:72px;padding:10px 12px;border-radius:14px;border:2px solid #a9c1ea;background:#eef4ff;text-align:left;color:var(--navy);width:100%}
.g-branch strong{font-size:20px}.g-branch span{font-size:16px;line-height:1.25}
.g-branch.good{border-color:#93d3ae;background:#eefaf3;color:#17673e}.g-branch.bad{border-color:#e58c9b;background:#fff1f3;color:#a3162d}
.g-branch.chosen{box-shadow:0 0 0 3px rgba(31,138,91,.35)}
.g-outcome{margin:10px 12px 0;padding:6px 0 0;border-top:1px dashed #cbd6e4;display:grid;gap:8px}
.g-outcome .g-node{margin:0}
.g-next{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:12px 12px 0;min-height:56px;border:0;border-radius:14px;background:linear-gradient(180deg,#2f6fe0,#1d55c4);color:#fff;font-size:19px;font-weight:900;box-shadow:0 6px 16px rgba(29,85,196,.3)}
.g-step.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:1px solid var(--line);background:#fff;text-align:left;font-size:18px;font-weight:800;color:var(--ink)}
.g-step.row .num{background:#c8d2e0;color:#34445c}.g-step.row b{margin-left:auto;font-size:24px;color:#8b9ab0}
.g-step.row.past{background:#f3f8f5;border-color:#cfe8da}.g-step.row.past .num{background:#1f8a5b;color:#fff}
.g-step.row.esc{border-color:#efb3bd;background:#fff7f8;color:#a3162d}.g-step.row.esc .num{background:#c4314b;color:#fff}
/* Full chart */
.fc-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.fc-tools button{min-height:44px;min-width:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:17px;font-weight:900}
.fc-tools button[data-zoom=print]{margin-left:auto;font-size:15px}
.fc-viewport{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#f7f9fc;touch-action:none;cursor:grab;min-height:280px}
.fc-viewport:active{cursor:grabbing}.fc-viewport:focus-visible{outline:3px solid #2f6fe0}
.fc-svg{display:block;user-select:none}
.fc-svg .nb{fill:#fff;stroke:#b9c6d8;stroke-width:1.5}
.fc-svg .nt{font:800 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0b2149}
.fc-svg .ns{font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#34445c}
.fc-svg .t-start .nb{fill:var(--acc,#c4314b);stroke:none}.fc-svg .t-start .nt,.fc-svg .t-start .ns{fill:#fff}
.fc-svg .meds .nb{fill:#fff8e6;stroke:#ecc56b}
.fc-svg .t-decision .nb{fill:#2f6fe0;stroke:none}.fc-svg .t-decision .nt,.fc-svg .t-decision .ns{fill:#fff}
.fc-svg .t-endpoint .nb{fill:#eefaf3;stroke:#93d3ae}.fc-svg .t-endpoint .nt{fill:#17673e}
.fc-svg .t-escalation .nb{fill:#fff1f3;stroke:#e58c9b}.fc-svg .t-escalation .nt{fill:#a3162d}
.fc-svg .grp{fill:#eef4ff;stroke:#a9c1ea;stroke-width:1.5}.fc-svg .grp-head{fill:#1d3f7a}
.fc-svg .grp-label{font:800 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}
.fc-svg .edge{fill:none;stroke:#2b4b7e;stroke-width:2}.fc-svg .arrowhead{fill:#2b4b7e}
.fc-svg .edge-label rect{fill:#2f6fe0}.fc-svg .edge-label.yes rect{fill:#1f8a5b}.fc-svg .edge-label.no rect{fill:#b4192f}
.fc-svg .edge-label text{font:800 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}
.fc-svg .svg-status circle{fill:#9aa8bb}.fc-svg .svg-status.done circle{fill:#1f8a5b}.fc-svg .svg-status.overdue circle{fill:#b4192f}.fc-svg .svg-status.active circle{fill:#d58b0a}
.fc-svg .svg-status text{font:900 12px sans-serif;fill:#fff}
.fc-svg [data-fnode]{cursor:pointer}.fc-svg [data-fnode]:focus{outline:none}.fc-svg [data-fnode]:focus .nb{stroke:#1d55c4;stroke-width:3}
.fc-hint{margin:6px 2px 0;font-size:14px;color:var(--muted)}
.view-chart:fullscreen,.fc-pseudo-full{background:#fff;padding:12px;overflow:auto}

.undo-man{margin:4px 6px 0}

.tool-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 12px calc(10px + var(--safe-bottom));background:rgba(234,241,248,.96);backdrop-filter:blur(8px);border-top:1px solid #d6e1ee}
.tool-bar button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border:1px solid #d0dbe8;background:#fff;color:#0f2140;border-radius:16px;font-weight:800;font-size:clamp(13px,1.8vw,20px);padding:6px}
.tool-bar button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool-bar button.active{background:#0f2a4c;color:#fff;border-color:#0f2a4c}
@media (max-width:599px){.tool-bar button{flex-direction:column;gap:2px;font-size:12px;min-height:58px}.tool-bar button svg{width:24px;height:24px}}
@media (max-width:380px){.tool-bar{gap:4px;padding-left:6px;padding-right:6px}.tool-bar button{font-size:11px}}

.tool-panel{max-height:calc(100dvh - 220px);overflow:auto}
.side-h{font-size:14px;letter-spacing:.08em;color:#4a5a72;margin:14px 2px 6px;text-transform:uppercase}

.alert-card{margin:12px 12px 0;padding:14px 16px;border-radius:18px;background:#fff7e6;border:3px solid #e0a11b;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.alert-card>div:first-child{display:flex;flex-direction:column;gap:2px}
.ac-label{font-weight:900;letter-spacing:.08em;font-size:14px;color:#8a5a00}
.alert-card strong{font-size:clamp(19px,2.2vw,24px);color:#0f2140}
.ac-time{font-weight:800;color:#a3162d;font-size:16px}
.ac-actions{display:flex;gap:8px;flex-wrap:wrap}
.ac-actions .button{min-height:52px;font-size:17px}
@media (min-width:600px){.alert-card,.alert-strip{margin-left:16px;margin-right:16px}}

/* Shoulder dystocia: clock left */
.clock-left{background:linear-gradient(180deg,#f6f2ff,#ece5ff);border-color:#a993e6}
.clock-left .du-label{background:var(--violet)}
.big-clock{font-size:clamp(72px,14vw,140px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#24135e;letter-spacing:-.02em;margin:auto 0}
.next-man{font-size:clamp(18px,2.2vw,22px)}
.clock-left .du-done{background:#4b2fa3}
.clock-left.delivered{background:linear-gradient(180deg,#f2fbf6,#e3f6ec);border-color:#7cc59b}
.clock-left.delivered .du-label{background:#178a50}.clock-left.delivered .big-clock{color:#0d5a33}
.clock-left.delivered .du-done{background:#178a50}

/* State A: Decision Mode */
body.decision-open .app-header,body.decision-open .bottom-nav{display:none}
.decision-mode{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#f4f8fc;padding:max(12px,env(safe-area-inset-top)) 16px calc(16px + var(--safe-bottom))}
.decision-mode.crimson{background:linear-gradient(180deg,#fff,#fdeff2)}.decision-mode.amber{background:linear-gradient(180deg,#fff,#fff5e3)}.decision-mode.violet{background:linear-gradient(180deg,#fff,#f3efff)}
.dm-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dm-tag{font-weight:900;letter-spacing:.08em;color:#0f2140;font-size:clamp(15px,2vw,22px)}
.dm-clock{background:#0f2a4c;color:#fff;font-size:clamp(28px,4vw,44px);font-weight:900;padding:8px 16px;border-radius:14px;font-variant-numeric:tabular-nums}
.decision-mode h1{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;font-size:clamp(40px,8vw,88px);line-height:1.04;font-weight:900;color:#0f2140;letter-spacing:-.02em;text-wrap:balance;outline:none}
.dm-answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dm-answers button{min-height:clamp(96px,20vh,180px);border:0;border-radius:24px;font-size:clamp(36px,6vw,64px);font-weight:900;letter-spacing:.04em;color:#fff}
.dm-yes{background:#178a50;box-shadow:0 10px 24px rgba(23,138,80,.28)}
.dm-no{background:#b8283f;box-shadow:0 10px 24px rgba(184,40,63,.28)}
.dm-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:clamp(16px,1.8vw,20px);color:#46566e;font-weight:700}
.dm-back{min-height:56px;padding:10px 20px;border-radius:16px;border:2px solid #0f2a4c;background:#fff;color:#0f2a4c;font-size:clamp(18px,2vw,22px);font-weight:850}
@media (max-height:520px){.decision-mode h1{font-size:clamp(32px,6vw,56px)}.dm-answers button{min-height:84px}}

/* Medication sheet: given time */
.given-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 10px}
.given-row>span{font-weight:850;color:#0f2140;margin-right:4px}
.chip{border:2px solid #c8d3e2;background:#fff;color:#0f2140;font-weight:800;font-size:16px;border-radius:999px;padding:8px 14px;min-height:44px}
.chip.on{background:#0f2a4c;border-color:#0f2a4c;color:#fff}
.big-confirm{min-height:60px;font-size:19px}
.med-more{margin:12px 0}.med-more summary{font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
.check-actions{display:grid;gap:10px}.check-actions .button{min-height:58px;font-size:19px}
.session-menu{display:grid;gap:10px}.session-menu .button{min-height:56px;font-size:18px}
.button.danger{background:#b8283f;color:#fff;border-color:#b8283f}

/* Team / instructor console */
.team-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
.team-stats div{background:#f2f6fb;border-radius:12px;padding:10px 6px;text-align:center}
.team-stats b{display:block;font-size:26px;color:#0f2140}.team-stats span{font-size:13px;color:#5d6b80;font-weight:700}
.role-list{display:grid;gap:8px}.role-list article{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.role-list strong{display:block;font-size:16px}.role-list span{font-size:15px;color:#46566e}
.instr-preset{display:flex;flex-direction:column;gap:4px;font-weight:800;margin:0 0 10px}
.instr-preset select,.vitals-grid input,.note-row input{min-height:44px;border:1px solid #c8d3e2;border-radius:10px;padding:6px 10px;font-size:16px;background:#fff}
.instr{border:1px solid #d6e1ee;border-radius:14px;margin-bottom:8px;background:#fff;overflow:hidden}
.instr summary{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;font-weight:850;font-size:17px;background:#eef3f9;cursor:pointer}
.instr summary b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--teal);color:#fff;font-size:14px}
.instr-body{padding:12px 14px}
.vitals-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.vitals-grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:800;color:#46566e}
.trigger-list{display:grid;gap:8px}
.trigger-list article{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px}
.trigger-list article.fired{opacity:.6}
.trigger-list strong{display:block}.trigger-list small{color:#5d6b80}.trigger-list p{margin:4px 0 0;font-size:15px}
.obs-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note-row{display:flex;gap:8px;margin:8px 0}.note-row input{flex:1;min-width:0}
.obj-list{margin:0 0 10px;padding-left:20px}.obj-list li{margin:4px 0}

/* Larger text and very narrow phones */
@media (max-width:420px){.ch-title{font-size:18px}.ch-title .em-icon img{width:32px;height:32px}.ch-clock{font-size:26px;padding:6px 10px}.ch-badge{font-size:12px;padding:5px 9px}.ch-back,.ch-menu{width:40px}}
@media (max-width:359px){.ch-title .em-icon{display:none}}
@media (max-width:520px){.ch-mode{display:none}.ch-badge.sim{font-size:0;padding:5px 9px}.ch-badge.sim::after{content:"SIM";font-size:12px}}
body.in-cockpit .app-shell{width:100%;max-width:1600px;background:transparent;box-shadow:none}
.du-icon .em-icon{width:auto;height:auto;border-radius:22px;overflow:hidden}
.du-icon .em-icon img{width:clamp(60px,8vw,96px);height:clamp(60px,8vw,96px);border-radius:22px}
.ch-title .em-icon{width:40px;height:40px;border-radius:50%;overflow:hidden}
@media (max-width:420px){.ch-title .em-icon{width:32px;height:32px}}
@media (min-width:600px){.dash-left .dash-urgent{min-height:min(calc(100dvh - 300px),640px)}}
body.in-cockpit .toast-region{top:calc(70px + env(safe-area-inset-top));bottom:auto}
.cockpit-status-row .sim-time-btn{min-height:36px;padding:4px 12px;font-size:14px}
@media (max-width:599px){
  .alert-strip .alert-main span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .alert-card{margin:10px 12px 0;padding:12px}
  .dash-urgent{padding:14px 14px 16px}
}
.vitals-grid input{width:100%;min-width:0;box-sizing:border-box}
.instr-preset select{width:100%}
.tl-short{display:none}
@media (max-width:420px){.tl-long{display:none}.tl-short{display:inline}}
@media (max-width:359px){.ch-back{display:none}.ch-clock{font-size:24px}}
.tool-bar button{min-width:0;overflow:hidden}
.sim-note{display:grid;gap:8px;background:#e9f8f6;border:2px solid var(--teal);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sim-note strong{font-size:17px}.sim-note span{font-size:15px;color:#33465f}.sim-note .button{justify-self:start}

/* Home: simulation is a separate, secondary door; clinical assist is the default */
.sim-door{margin:4px 12px 10px;display:grid;grid-template-columns:48px minmax(0,1fr) 16px;gap:14px;align-items:center;padding:14px;border:1px solid #b9e2dc;border-left:6px solid var(--teal);border-radius:16px;background:#f2fbf9;color:var(--ink);text-decoration:none}
.sim-door-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#dff6f2;color:#126b63;font-size:18px}
.sim-door .em-copy{display:flex;flex-direction:column;gap:4px}.sim-door strong{font-size:18px}.sim-door small{font-size:14px;color:var(--muted);line-height:1.35}
.practice-band{margin:12px 12px 0;padding:12px 14px;border-radius:14px;background:var(--teal);color:white;display:flex;justify-content:space-between;align-items:center;gap:12px}
.practice-band>div{display:flex;flex-direction:column;gap:2px}.practice-band small{opacity:.9;font-size:13px}.practice-band .text-button{color:white;font-size:14px}

      {h:"IV above the diaphragm",t:"Arms or neck."},
      {h:"Fetal monitors",t:"Detach them."},
      {h:"Magnesium running?",t:"Stop it and give calcium."}]},
    {kind:"big",title:"The clock",items:[{big:"4 min",label:"No ROSC → start delivery"},{big:"5 min",label:"Target: baby delivered"}],
      note:"Prepare from minute one. Deliver where the resuscitation is happening."},
    {kind:"split",title:"Find the cause: A–H",left:{h:"A–D",items:["Anesthetic complications","Bleeding","Cardiovascular","Drugs"]},right:{h:"E–H",items:["Embolic: amniotic fluid or PE","Fever","General H’s and T’s","Hypertension (preeclampsia)"]}},
    {kind:"steps",title:"Amniotic fluid embolism",steps:["Sudden collapse in labor or just after birth","High-quality CPR · deliver if arrested","Activate massive transfusion","Check coagulation early","Avoid fluid overload"],note:"A clinical diagnosis — no test confirms or excludes it."}
  ],

  simulation:[
    {kind:"title",title:"Using Simulation mode",sub:"Same actions and timers — the facilitator controls time"},
    {kind:"split",tone:"dodont",title:"Time controls",left:{h:"They do",items:["Pause the clock","Jump +1 or +5 minutes","Fire reminders that fall due"]},right:{h:"They never",items:["Give a medication","Complete a task","Improve the patient","Advance a branch"]}},
    {kind:"steps",title:"Suggested exercise",steps:["Start the assist and brief","Assign tasks out loud; tap Start / Done","Advance to the next reminder","Require call-out + check-back for medications","Introduce deterioration → huddle","Debrief with the event timeline"]},

// Flowchart engine: one pathway record (pathways.js) → three views.
//   Overview  — semantic HTML map of every stage and branch (default)
//   Guided    — numbered steps with checklists, labelled decision branches
//   Full chart— SVG diagram with pan, pinch/wheel zoom, fit, fullscreen, print
// Rendering is pure: callers pass a ctx with task status and UI state.
// Events are wired in app.js through data-* attributes.

const fcEsc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE_LABEL={start:"Start",action:"Action",decision:"Decision",parallel:"At the same time",escalation:"Escalation",endpoint:"Outcome"};

// ---------- shared helpers ----------
function allGroups(p){const m=new Map();p.chart.rows.forEach(r=>r.forEach(c=>{if(typeof c==="object")m.set(c.group,c);}));return m;}
function rowOf(p,id){for(let i=0;i<p.chart.rows.length;i++){for(const c of p.chart.rows[i]){if(c===id)return i;if(typeof c==="object"&&(c.group===id||c.nodes.includes(id)||c.head===id))return i;}}return -1;}
function incomingLabel(p,id){
  // label of the branch that leads into `id` (e.g. "Yes", "No"), if any
  for(const [nid,n] of Object.entries(p.nodes))for(const c of n.connections||[])if(c.to===id&&c.label)return {label:c.label,from:nid};
  return null;
}
function nodeStatus(node,ctx){
  const tasks=(node.items||[]).map(i=>i.task).filter(Boolean);
  if(!tasks.length||!ctx.sessionActive)return null;
  const st=tasks.map(t=>ctx.taskStatus(t));
  if(st.includes("overdue"))return "overdue";
  if(st.every(s=>s==="done"))return "done";
  if(st.some(s=>s==="done"||s==="progress"||s==="ongoing"))return "active";
  return "todo";
}
const STATUS_TEXT={done:"Done",active:"In progress",overdue:"Overdue",todo:"To do"};
function statusBadge(s){return s&&s!=="todo"?`<span class="fc-status ${s}" aria-label="${STATUS_TEXT[s]}">${s==="done"?"✓":s==="overdue"?"!":s==="active"?"•":""}</span>`:"";}

// ---------- Overview ----------
function ovBox(p,id,ctx,{compact=false}={}){
  const n=p.nodes[id];const s=nodeStatus(n,ctx);const inc=incomingLabel(p,id);
  const body=n.bullets?.length?`<ul>${n.bullets.map(b=>`<li>${fcEsc(b)}</li>`).join("")}</ul>`:`<p>${fcEsc(n.summary)}</p>`;
  return `<button class="ov-box t-${n.type} u-${n.urgency}${n.medicationRefs?" meds":""}${s?` s-${s}`:""}" data-fnode="${id}" aria-label="${fcEsc(n.title)}. ${fcEsc(n.summary)}${s?`. ${STATUS_TEXT[s]}`:""}">
    ${inc&&!compact?`<span class="ov-branch">${fcEsc(inc.label)}</span>`:""}
    <span class="ov-title">${fcEsc(n.title)}${statusBadge(s)}</span>${compact&&n.type!=="decision"?`<p>${fcEsc(n.summary)}</p>`:n.type==="decision"?`<p>${fcEsc(n.summary)}</p>`:body}
  </button>`;
}
function renderOverview(p,ctx,{compact=false}={}){
  return `<div class="ov${compact?" compact":""}">${p.chart.rows.map((row,i)=>{
    const cells=row.map(c=>{
      if(typeof c==="string")return ovBox(p,c,ctx,{compact});
      const head=c.head?p.nodes[c.head]:null;const hs=head?nodeStatus(head,ctx):null;
      return `<div class="ov-group${c.nodes.length>2?" many":""}" role="group" aria-label="${fcEsc(c.label)}">
        <button class="ov-group-head" data-fnode="${c.head||c.nodes[0]}">${fcEsc(c.label)}${statusBadge(hs)}</button>
        <div class="ov-group-cells n${c.nodes.length}">${c.nodes.map(id=>ovBox(p,id,ctx,{compact:true})).join("")}</div></div>`;
    }).join("");
    const arrow=i<p.chart.rows.length-1?`<div class="ov-arrow" aria-hidden="true">${row.length===1&&p.nodes[row[0]]?.type==="decision"?"↙ ↘":"↓"}</div>`:"";
    return `<div class="ov-row n${row.length}">${cells}</div>${arrow}`;
  }).join("")}</div>`;
}

// ---------- Guided ----------
function stepOfNode(p,id){return p.steps.findIndex(s=>s.nodes.includes(id));}
function itemHTML(p,nid,item,i,ctx){
  if(item.med)return `<button class="g-med" data-med-id="${item.med}"><span aria-hidden="true">Rx</span>${fcEsc(item.text)}<b aria-hidden="true">›</b></button>`;
  if(item.pathway)return `<button class="g-med path" data-fpath="${item.pathway}"><span aria-hidden="true">→</span>${fcEsc(item.text)}<b aria-hidden="true">›</b></button>`;
  let on,key;
  if(item.task&&ctx.sessionActive){const st=ctx.taskStatus(item.task);on=st==="done"||st==="ongoing";key=`task:${item.task}`;}
  else{key=`local:${p.id}:${nid}:${i}`;on=ctx.localChecks.has(key);}
  const overdue=item.task&&ctx.sessionActive&&ctx.taskStatus(item.task)==="overdue";
  return `<button class="g-check${on?" on":""}${overdue?" overdue":""}" role="checkbox" aria-checked="${on}" data-gcheck="${key}"><span class="box" aria-hidden="true">${on?"✓":""}</span><span>${fcEsc(item.text)}${overdue?` <em>overdue</em>`:""}</span></button>`;
}
function nodeBlock(p,nid,ctx){
  const n=p.nodes[nid];
  const items=(n.items||[]).map((it,i)=>itemHTML(p,nid,it,i,ctx)).join("");
  if(!items)return `<button class="g-info" data-fnode="${nid}"><strong>${fcEsc(n.title)}</strong><span>${fcEsc(n.summary)}</span></button>`;
  return `<div class="g-node"><button class="g-node-head" data-fnode="${nid}"><span>${fcEsc(n.title)}</span><i aria-hidden="true">i</i></button>${items}</div>`;
}
function renderGuided(p,ctx){
  const k=Math.min(ctx.step??0,p.steps.length-1);const step=p.steps[k];
  const branch=ctx.branch;
  const dec=step.decision?p.nodes[step.decision]:null;
  const branchBtns=dec?`<div class="g-question"><p>${fcEsc(dec.title)}</p><span>${fcEsc(dec.summary)}</span><div class="g-branches">${dec.connections.map(c=>{const t=p.nodes[c.to]||{};const cls=t.type==="escalation"||stepOfNode(p,c.to)>=0&&p.steps[stepOfNode(p,c.to)].escalation?"bad":t.type==="endpoint"?"good":"";return `<button class="g-branch ${cls}${branch===c.to?" chosen":""}" data-gbranch="${c.to}"><strong>${fcEsc(c.label)}</strong><span>${fcEsc(t.title||"Next")}</span></button>`;}).join("")}</div></div>`:"";
  // A chosen branch whose target is not its own step (e.g. "Controlled") is shown inline here.
  const inline=branch&&p.nodes[branch]&&stepOfNode(p,branch)<0?(()=>{const t=p.nodes[branch];return `<div class="g-outcome t-${t.type}">${nodeBlock(p,branch,ctx)}${(t.connections||[]).map(c=>`<button class="g-branch bad" data-gbranch="${c.to}"><strong>${fcEsc(c.label||"Next")}</strong><span>${fcEsc(p.nodes[c.to]?.title||"")}</span></button>`).join("")}</div>`;})():"";
  const body=step.nodes.filter(id=>id!==step.decision||(p.nodes[id].items||[]).length).map(id=>nodeBlock(p,id,ctx)).join("");
  return `<div class="g">
    <div class="g-progress"><span>Step ${k+1} of ${p.steps.length}</span><div class="bar"><i style="width:${Math.round((k+1)/p.steps.length*100)}%"></i></div></div>
    <p class="g-mode-note">${ctx.sessionActive?"Checks update the action cards and timeline.":"Reference mode — checks stay on this screen only."}</p>
    ${p.steps.map((s,i)=>{
      if(i===k)return `<section class="g-step current${s.escalation?" esc":""}" aria-current="step">
        <h3><span class="num">${i+1}</span>${fcEsc(s.title)}</h3>
        ${s.parallel?`<p class="g-parallel">All at the same time — not in order</p>`:""}
        ${body}${branchBtns}${inline}
        ${i<p.steps.length-1&&!dec?`<button class="g-next" data-gstep="${i+1}"><span aria-hidden="true">✓</span> Done → Next step</button>`:""}
      </section>`;
      return `<button class="g-step row${i<k?" past":""}${s.escalation?" esc":""}" data-gstep="${i}"><span class="num">${i<k?"✓":i+1}</span><span>${fcEsc(s.title)}</span><b aria-hidden="true">›</b></button>`;
    }).join("")}
  </div>`;
}

// ---------- Full chart (SVG) ----------
const FC_W=600,FC_GAP=14,FC_ROWGAP=46,FC_PAD=16;
function fcWrap(text,maxChars){const words=String(text||"").split(/\s+/);const lines=[];let cur="";for(const w of words){if((cur+" "+w).trim().length>maxChars&&cur){lines.push(cur);cur=w;}else cur=(cur+" "+w).trim();}if(cur)lines.push(cur);return lines;}
function boxSize(n,width){
  const tl=fcWrap(n.title,Math.floor(width/9.6)),sl=fcWrap(n.summary,Math.floor(width/7.4));
  return {tl,sl,h:18+tl.length*19+sl.length*16+12};
}
function renderChartSVG(p,ctx){
  const place={};let y=FC_PAD;const parts=[];const groupsDrawn=[];
  p.chart.rows.forEach(row=>{
    const cellW=(FC_W-FC_PAD*2-FC_GAP*(row.length-1))/row.length;let x=FC_PAD;let rowH=0;const pending=[];
    row.forEach(c=>{
      if(typeof c==="string"){const n=p.nodes[c];const sz=boxSize(n,cellW);pending.push({kind:"node",id:c,x,w:cellW,sz});rowH=Math.max(rowH,sz.h);}
      else{
        const inner=c.nodes.length;const iw=(cellW-12-8*(inner-1))/inner;const sizes=c.nodes.map(id=>boxSize(p.nodes[id],iw));
        const ih=Math.max(...sizes.map(s=>s.h));const gh=34+ih+10;
        pending.push({kind:"group",g:c,x,w:cellW,iw,sizes,ih,h:gh});rowH=Math.max(rowH,gh);
      }
      x+=cellW+FC_GAP;
    });
    pending.forEach(it=>{
      if(it.kind==="node"){const h=it.sz.h;place[it.id]={x:it.x,y,w:it.w,h};parts.push(drawNode(p,it.id,it.x,y,it.w,h,it.sz,ctx));}
      else{
        place[it.g.group]={x:it.x,y,w:it.w,h:it.h};
        const head=it.g.head?p.nodes[it.g.head]:null;
        groupsDrawn.push(`<g class="svg-group" ${it.g.head?`data-fnode="${it.g.head}" role="button" tabindex="0" aria-label="${fcEsc(it.g.label)}"`:""}><rect x="${it.x}" y="${y}" width="${it.w}" height="${it.h}" rx="14" class="grp"/><rect x="${it.x}" y="${y}" width="${it.w}" height="28" rx="14" class="grp-head"/><rect x="${it.x}" y="${y+14}" width="${it.w}" height="14" class="grp-head"/><text x="${it.x+it.w/2}" y="${y+19}" class="grp-label" text-anchor="middle">${fcEsc(it.g.label)}${head?" ⓘ":""}</text></g>`);
        let ix=it.x+6;it.g.nodes.forEach((id,k)=>{place[id]={x:ix,y:y+34,w:it.iw,h:it.ih};parts.push(drawNode(p,id,ix,y+34,it.iw,it.ih,it.sizes[k],ctx));ix+=it.iw+8;});
      }
    });
    y+=rowH+FC_ROWGAP;
  });
  const H=y-FC_ROWGAP+FC_PAD;
  // edges
  const edges=[];
  const add=(from,c)=>{const a=place[from],b=place[c.to];if(!a||!b)return;
    const sameRow=Math.abs(a.y-b.y)<2;
    if(sameRow){const left=a.x<b.x;const x1=left?a.x+a.w:a.x,x2=left?b.x:b.x+b.w,yy=a.y+Math.min(a.h,b.h)/2;
      edges.push(`<path d="M${x1} ${yy} L${x2} ${yy}" class="edge" marker-end="url(#arr)"/>`);if(c.label)edges.push(edgeLabel((x1+x2)/2,yy-8,c.label,c.label));return;}
    const x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,my=y1+(y2-y1)/2;
    edges.push(`<path d="M${x1} ${y1} L${x1} ${my} L${x2} ${my} L${x2} ${y2-2}" class="edge" marker-end="url(#arr)"/>`);
    if(c.label)edges.push(edgeLabel(x2,my+15,c.label,c.label));
  };
  Object.entries(p.nodes).forEach(([id,n])=>(n.connections||[]).forEach(c=>add(id,c)));
  allGroups(p).forEach(g=>(g.connections||[]).forEach(c=>add(g.group,c)));
  return {W:FC_W,H,svg:`<svg viewBox="0 0 ${FC_W} ${H}" width="${FC_W}" height="${H}" class="fc-svg" role="img" aria-label="${fcEsc(p.title)} full algorithm" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
    ${groupsDrawn.join("")}${edges.join("")}${parts.join("")}</svg>`};
}
function edgeLabel(x,y,text,kind){const w=Math.max(34,text.length*7.4+16);const cls=/^yes/i.test(kind)?"yes":/^no/i.test(kind)?"no":"";return `<g class="edge-label ${cls}"><rect x="${x-w/2}" y="${y-13}" width="${w}" height="20" rx="10"/><text x="${x}" y="${y+1}" text-anchor="middle">${fcEsc(text)}</text></g>`;}
function drawNode(p,id,x,y,w,h,sz,ctx){
  const n=p.nodes[id];const s=nodeStatus(n,ctx);
  const shape=n.type==="decision"
    ?`<path d="M${x+18} ${y} H${x+w-18} L${x+w} ${y+h/2} L${x+w-18} ${y+h} H${x+18} L${x} ${y+h/2} Z" class="nb"/>`
    :`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" class="nb"/>`;
  let ty=y+24;const t=sz.tl.map(l=>{const r=`<text x="${x+w/2}" y="${ty}" class="nt" text-anchor="middle">${fcEsc(l)}</text>`;ty+=19;return r;}).join("");
  ty+=2;const sm=sz.sl.map(l=>{const r=`<text x="${x+w/2}" y="${ty}" class="ns" text-anchor="middle">${fcEsc(l)}</text>`;ty+=16;return r;}).join("");
  const badge=s&&s!=="todo"?`<g class="svg-status ${s}"><circle cx="${x+w-12}" cy="${y+12}" r="9"/><text x="${x+w-12}" y="${y+16}" text-anchor="middle">${s==="done"?"✓":s==="overdue"?"!":"•"}</text></g>`:"";
  return `<g class="svg-node t-${n.type} u-${n.urgency}${n.medicationRefs?" meds":""}" data-fnode="${id}" role="button" tabindex="0" aria-label="${fcEsc(n.title)}. ${fcEsc(n.summary)}${s?`. ${STATUS_TEXT[s]}`:""}">${shape}${t}${sm}${badge}</g>`;
}
function renderChart(p,ctx){
  const {svg}=renderChartSVG(p,ctx);
  return `<div class="fc-tools" role="toolbar" aria-label="Chart controls">
      <button data-zoom="in" aria-label="Zoom in">＋</button><button data-zoom="out" aria-label="Zoom out">−</button>
      <button data-zoom="fit">Fit</button><button data-zoom="full" aria-label="Fullscreen">⛶</button><button data-zoom="print">Print / PDF</button>
    </div>
    <div class="fc-viewport" tabindex="0" aria-label="Full algorithm. Drag to pan, pinch or use the buttons to zoom.">${svg}</div>
    <p class="fc-hint">Drag to pan · pinch or ＋/− to zoom · tap a box for details</p>`;
}

// ---------- pan / zoom ----------
function mountChart(root,saved){
  const vp=root.querySelector(".fc-viewport");const svg=vp?.querySelector("svg");if(!svg)return null;
  const W0=+svg.getAttribute("width"),H0=+svg.getAttribute("height");
  let s=1,tx=0,ty=0;const pts=new Map();let moved=false,start=null,pinch=null;
  const apply=()=>{svg.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;};
  const fit=()=>{const r=vp.getBoundingClientRect();s=Math.min(r.width/W0,1.6);tx=(r.width-W0*s)/2;ty=0;vp.style.height=Math.min(Math.max(H0*s+8,280),window.innerHeight*0.78)+"px";apply();};
  const zoomAt=(f,cx,cy)=>{const ns=Math.min(4,Math.max(0.3,s*f));tx=cx-(cx-tx)*(ns/s);ty=cy-(cy-ty)*(ns/s);s=ns;apply();};
  svg.style.transformOrigin="0 0";svg.style.width=W0+"px";svg.style.height=H0+"px";
  vp.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={x:e.clientX,y:e.clientY,tx,ty};if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s};}});
  const onMove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const r=vp.getBoundingClientRect();const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((pinch.s*d/pinch.d)/s,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);moved=true;return;}
    if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){tx=start.tx+dx;ty=start.ty+dy;apply();}}};
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)start=null;};
  window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);
  vp.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  vp.addEventListener("keydown",e=>{const r=vp.getBoundingClientRect();if(e.key==="+"||e.key==="=")zoomAt(1.2,r.width/2,r.height/2);if(e.key==="-")zoomAt(1/1.2,r.width/2,r.height/2);if(e.key==="0")fit();
    const step=40;if(e.target===vp){if(e.key==="ArrowLeft"){tx+=step;apply();}if(e.key==="ArrowRight"){tx-=step;apply();}if(e.key==="ArrowUp"){ty+=step;apply();e.preventDefault();}if(e.key==="ArrowDown"){ty-=step;apply();e.preventDefault();}}});
  // Restore the previous pan/zoom after a re-render (e.g. a timer firing), else fit to width.
  if(saved){s=saved.s;tx=saved.tx;ty=saved.ty;vp.style.height=saved.h;apply();}else fit();
  let lastW=vp.parentElement.getBoundingClientRect().width;
  const ro=new ResizeObserver(()=>{const w=vp.parentElement.getBoundingClientRect().width;if(Math.abs(w-lastW)>2){lastW=w;fit();}});ro.observe(vp.parentElement);
  return {
    zoom(d){const r=vp.getBoundingClientRect();zoomAt(d==="in"?1.25:1/1.25,r.width/2,r.height/2);},
    fit,
    state(){return {s,tx,ty,h:vp.style.height};},
    full(){const host=root;if(document.fullscreenElement){document.exitFullscreen();return;}
      if(host.requestFullscreen){host.requestFullscreen().then(()=>setTimeout(fit,120)).catch(()=>{host.classList.toggle("fc-pseudo-full");setTimeout(fit,50);});}
      else{host.classList.toggle("fc-pseudo-full");setTimeout(fit,50);}},
    destroy(){ro.disconnect();window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);}
  };
}

const DEFAULT_KEY = "ob-emergency-assist.session.v1";
const SCHEMA_VERSION = "1.0";

function clone(value){ return value == null ? value : JSON.parse(JSON.stringify(value)); }

function createLocalSessionStore({key=DEFAULT_KEY,storage=globalThis.localStorage}={}){
  const listeners = new Set();
  const read = () => {
    try {
      const saved = JSON.parse(storage.getItem(key) || "null");
      if(!saved) return null;
      if(!Number.isInteger(saved.revision)) saved.revision = 0;
      if(!saved.schemaVersion) saved.schemaVersion = SCHEMA_VERSION;
      if(!Array.isArray(saved._actionEvents)) saved._actionEvents = [];
      return saved;
    }
    catch { return null; }
  };
  const write = value => storage.setItem(key, JSON.stringify(value));
  const emit = value => listeners.forEach(fn => fn(clone(value)));

  return {
    createSession(seed){
      const session = {
        ...clone(seed), schemaVersion:SCHEMA_VERSION, revision:0,
        _actionEvents:[{
          eventId:`created-${seed.id}`, sessionId:seed.id, taskId:null,
          type:"SESSION_CREATED", status:"active", actor:"local-device",
          occurredAt:new Date().toISOString(), schemaVersion:SCHEMA_VERSION,
          revision:0, simulationTimeMs:seed.mode === "simulation" ? 0 : null
        }]
      };
      write(session); emit(session); return clone(session);
    },
    loadSession(){ return clone(read()); },
    recordAction({event,nextState,expectedRevision}){
      const current = read();
      if(!current) return {applied:false,missing:true,session:null};
      const prior = current._actionEvents || [];
      if(prior.some(x => x.eventId === event.eventId)) return {applied:false,duplicate:true,session:clone(current)};
      if(expectedRevision !== current.revision || event.revision !== current.revision + 1) return {applied:false,conflict:true,session:clone(current)};
      const normalized = {
        eventId:event.eventId, sessionId:current.id, taskId:event.taskId ?? null,
        type:event.type, status:event.status ?? null, actor:event.actor || "local-device",
        occurredAt:event.occurredAt || new Date().toISOString(), schemaVersion:SCHEMA_VERSION,
        revision:event.revision, simulationTimeMs:event.simulationTimeMs ?? null,
        payload:clone(event.payload || {})
      };
      const saved = {...clone(nextState),schemaVersion:SCHEMA_VERSION,revision:normalized.revision,_actionEvents:[...prior,normalized]};
      write(saved); emit(saved); return {applied:true,session:clone(saved),event:clone(normalized)};
    },
    subscribe(listener){ listeners.add(listener); return () => listeners.delete(listener); },
    replaceAuthoritative(nextState){ write(clone(nextState)); emit(nextState); return clone(nextState); },
    clear(){ storage.removeItem(key); emit(null); }
  };
}

// Client adapter for the optional Apps Script build. The Netlify release does not use this file.
function createWorkspaceSessionStore({key="ob-emergency-assist.session.v1",pollMs=3000}={}){
  const local=createLocalSessionStore({key});
  let activeSessionId=null,pollHandle=null;
  const call=(name,...args)=>new Promise((resolve,reject)=>{
    if(!globalThis.google?.script?.run){reject(new Error("google.script.run unavailable"));return;}
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
  });
  const mergeAuthoritative=remote=>{
    if(!remote)return null;
    const privateState=local.loadSession()||{};
    if(Number(remote.revision||0)<Number(privateState.revision||0))return privateState;
    const merged={...privateState,...remote,events:privateState.events||[],doseCounts:privateState.doseCounts||{},_actionEvents:privateState._actionEvents||[]};
    return local.replaceAuthoritative(merged);
  };
  const coordinationSnapshot=session=>{
    const clean=JSON.parse(JSON.stringify(session));
    delete clean._actionEvents;delete clean.events;delete clean.doseCounts;
    clean.timers=(clean.timers||[]).map(({medId,...timer})=>timer);
    return clean;
  };
  const coordinationEvent=event=>event.type==="MEDICATION_ADMINISTERED"?{...event,type:"TASK_UPDATED",payload:{coordinationOnly:true}}:event;
  const beginPolling=()=>{
    clearInterval(pollHandle);
    if(!activeSessionId)return;
    pollHandle=setInterval(async()=>{
      try{
        const current=local.loadSession(),result=await call("pollSession",activeSessionId,current?.revision||0);
        if(result?.changed&&result.session)mergeAuthoritative(result.session);
      }catch{/* Local emergency screen remains usable while sync is unavailable. */}
    },pollMs);
  };
  return {
    createSession(seed){
      const created=local.createSession(seed);activeSessionId=created.id;beginPolling();
      call("createSession",coordinationSnapshot(created)).then(r=>r?.session&&mergeAuthoritative(r.session)).catch(()=>{});
      return created;
    },
    loadSession(){const s=local.loadSession();activeSessionId=s?.id||null;beginPolling();return s;},
    recordAction(input){
      const result=local.recordAction(input);
      if(result.applied){
        call("recordAction",coordinationEvent(result.event),coordinationSnapshot(result.session),input.expectedRevision)
          .then(r=>r?.session&&mergeAuthoritative(r.session)).catch(()=>{});
      }
      return result;
    },
    subscribe(listener){return local.subscribe(listener);},
    clear(){activeSessionId=null;clearInterval(pollHandle);local.clear();}
  };
}

// Back-button guard for the installed app (Android back / browser back).
// Keeps one history entry above the page so "back" runs onBack() instead of leaving.
// onBack() returns true when it handled the press (closed a sheet, went to the previous
// screen…); false lets the press leave the page as normal.
// Chrome ignores history entries pushed without a user gesture, so the guard is armed
// on the first tap/keypress and re-armed after each handled back.
function installBackGuard(onBack){
  if(!("pushState" in history))return;
  try{history.replaceState({...(history.state||{}),bg:0},"");}catch{return;}
  let armed=false,leaving=false;
  const arm=()=>{if(armed||leaving)return;armed=true;history.pushState({bg:1},"");};
  addEventListener("pointerdown",arm,true);addEventListener("keydown",arm,true);
  addEventListener("popstate",e=>{
    if(leaving||e.state?.bg!==0)return;
    armed=false;
    let handled=false;try{handled=!!onBack();}catch{}
    if(handled)arm();else{leaving=true;history.back();}
  });
}

// Task engine: task states, checklist sections and the single most-urgent action.
// No DOM. Run under node --test.
//
// Stored states (kept for old sessions): todo | progress | ongoing | done
// Displayed states: pending | ongoing | completed

const RANK = {critical:0,high:1,routine:2};

function displayState(stored){
  if(stored==="done")return "completed";
  if(stored==="ongoing"||stored==="progress")return "ongoing";
  return "pending";
}

// tasks: ordered task list for the emergency
// states: {taskId:{status}}           overdue: Set of task ids with a due reminder
// activated: Set of task ids brought forward by a decision answer
// gated: Set of task ids held back until activated         pinned: task id or null
function buildChecklist({tasks,states={},overdue=new Set(),activated=new Set(),gated=new Set(),pinned=null}){
  const st=id=>displayState(states[id]?.status);
  const order=new Map(tasks.map((t,i)=>[t.id,i]));
  const completed=[],ongoing=[],pending=[];
  for(const t of tasks){
    const s=st(t.id);
    if(s==="completed")completed.push(t);
    else if(s==="ongoing"&&!overdue.has(t.id))ongoing.push(t);
    else pending.push(t);
  }
  // NOW/DUE = overdue ∪ activated ∪ pending tasks in the first two open groups (gated tasks excluded).
  const openGroups=[];
  for(const t of pending){
    if(gated.has(t.id)&&!activated.has(t.id))continue;
    if(!openGroups.includes(t.group))openGroups.push(t.group);
  }
  const nowGroups=new Set(openGroups.slice(0,2));
  const isNow=t=>overdue.has(t.id)||activated.has(t.id)||(nowGroups.has(t.group)&&!(gated.has(t.id)&&!activated.has(t.id)));
  const now=pending.filter(isNow),next=pending.filter(t=>!isNow(t));
  const rank=t=>[
    t.id===pinned?0:1,
    overdue.has(t.id)?0:1,
    RANK[t.priority]??2,
    order.get(t.id)
  ];
  const cmp=(a,b)=>{const x=rank(a),y=rank(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0;};
  now.sort(cmp);
  const mostUrgent=now[0]||next.find(t=>!gated.has(t.id))||null;
  return {
    mostUrgent,
    now:now.filter(t=>t!==mostUrgent),
    ongoing,
    completed,
    next:next.filter(t=>t!==mostUrgent),
    total:tasks.length,
    done:completed.length
  };
}

// Decision queue. Triggers only ASK a question; an answer is recorded only from a tap.
// No DOM. Session fields used: session.decisions = {queue:[], answers:[], closed:[]}
//                              session.branch    = {activated:[], pinned:null, reopen:[]}

function ensureDecisionState(session){
  session.decisions=session.decisions||{queue:[],answers:[],closed:[]};
  session.branch=session.branch||{activated:[],pinned:null};
  return session;
}

function done(session,id){const s=session.tasks?.[id]?.status;return s==="done"||s==="ongoing"||s==="progress";}
function canAsk(session,d){
  const q=session.decisions;
  if(q.closed.includes(d.id))return false;
  if(q.queue.some(x=>x.id===d.id))return false;
  if(!d.repeat&&q.answers.some(a=>a.id===d.id))return false;
  return (d.requires||[]).every(id=>done(session,id));
}
function enqueue(session,d,atMs,trigger){session.decisions.queue.push({id:d.id,dueAt:atMs,trigger,deferred:false});return d.id;}

// A task was completed, assessed or marked ongoing.
function onTaskEvent(session,decisions,taskId,atMs){
  ensureDecisionState(session);
  return decisions.filter(d=>(d.on||[]).includes(taskId)&&canAsk(session,d)).map(d=>enqueue(session,d,atMs,`task:${taskId}`));
}
// A medication reassessment reminder came due.
function onTimerDue(session,decisions,medId,atMs){
  ensureDecisionState(session);
  return decisions.filter(d=>(d.onTimer||[]).includes(medId)&&canAsk(session,d)).map(d=>enqueue(session,d,atMs,`timer:${medId}`));
}
// Clock tick: minute-based questions are asked once.
function onTick(session,decisions,nowMs){
  ensureDecisionState(session);
  return decisions.filter(d=>d.atMin!=null&&nowMs>=d.atMin*60000&&canAsk(session,d)&&!session.decisions.answers.some(a=>a.id===d.id)).map(d=>enqueue(session,d,d.atMin*60000,`minute:${d.atMin}`));
}

// Back to actions: no answer is recorded; the question stays queued.
function defer(session,id){
  ensureDecisionState(session);
  const item=session.decisions.queue.find(x=>x.id===id);
  if(item){item.deferred=true;item.deferrals=(item.deferrals||0)+1;}
  return item||null;
}
function reopen(session,id){
  const item=session.decisions?.queue.find(x=>x.id===id);if(item)item.deferred=false;return item||null;
}

// Record an answer. Returns the effects for the caller to apply to task state.
function answer(session,decisions,id,value,atMs){
  ensureDecisionState(session);
  const d=decisions.find(x=>x.id===id);if(!d)throw new Error(`Unknown decision ${id}`);
  const a=d.answers.find(x=>x.value===value);if(!a)throw new Error(`Unknown answer ${value}`);
  session.decisions.queue=session.decisions.queue.filter(x=>x.id!==id);
  session.decisions.answers.push({id,value,at:atMs,branch:a.branch||null});
  if(a.terminal)session.decisions.closed.push(id);
  const act=new Set(session.branch.activated);(a.activate||[]).forEach(t=>act.add(t));
  session.branch.activated=[...act];
  if(a.pin)session.branch.pinned=a.pin;
  return {activate:a.activate||[],reopen:a.reopen||[],pin:a.pin||null,note:a.note||"",branch:a.branch||null,label:a.label};
}

// The question to show full screen now (first one not deferred), or null.
function takeover(session){return session.decisions?.queue.find(x=>!x.deferred)||null;}
function waiting(session){return session.decisions?.queue||[];}

// SessionClock: one interface over the real-time and simulation clocks.
// The live clock is wall time since start; its write methods throw.
// Session fields used: mode, elapsedBase, running, lastTickAt.

class LiveClockError extends Error{}

function createSessionClock(session,wall=()=>Date.now()){
  const simulated=session.mode==="simulation";
  const guard=()=>{if(!simulated)throw new LiveClockError("The live clock cannot be paused or advanced. Start a separate simulation.");};
  const clock={
    isSimulated:simulated,
    now(){return session.elapsedBase+(session.running?wall()-session.lastTickAt:0);},
    pause(){guard();if(session.running){session.elapsedBase=clock.now();session.running=false;session.lastTickAt=wall();}},
    resume(){guard();if(!session.running){session.running=true;session.lastTickAt=wall();}},
    advance(ms){guard();if(!(ms>=0))throw new RangeError("Advance must be zero or more");session.elapsedBase=clock.now()+ms;session.lastTickAt=wall();},
    stop(){session.elapsedBase=clock.now();session.running=false;session.lastTickAt=wall();}
  };
  return clock;
}

// Events the simulation clock passed when it jumped from `fromMs` to `toMs`.
function crossed(items,fromMs,toMs){return items.filter(x=>x.atMs>fromMs&&x.atMs<=toMs).sort((a,b)=>a.atMs-b.atMs);}

// Alert levels. No DOM.
//   P0  decision takeover (full screen)               — decisions.js
//   P1  reassessment / post-dose reminder: alert card over the dashboard, snooze 1 min
//       snoozed twice → P1 banner (stays until acknowledged); crossed during a sim jump → banner
//   P2  milestone or minute mark: banner only, never a takeover
//   P3  status-strip count     P4  timeline entry only
// Acknowledging an alert never completes a task.

const SNOOZE_MIN=1;
const MAX_SNOOZES=2;

function level(timer){
  if(timer.kind==="milestone")return "P2";
  if(timer.kind==="repeat"||timer.kind==="medication")return "P1";
  return "P3";
}

// timers: session.timers (dueAt and snoozedUntil in minutes)
function activeAlerts(timers,nowMin){
  return timers.filter(t=>!t.cancelled&&!t.ack&&t.dueAt<=nowMin).map(t=>{
    const lv=level(t),snoozed=(t.snoozedUntil||0)>nowMin,snoozes=t.snoozes||0;
    const form=lv==="P1"&&snoozes<MAX_SNOOZES&&!snoozed&&!t.summarized?"card":lv==="P3"?"count":"banner";
    return {id:t.id,level:lv,form,snoozes,timer:t,overdueMin:nowMin-t.dueAt};
  }).sort((a,b)=>a.level.localeCompare(b.level)||a.timer.dueAt-b.timer.dueAt);
}

function snooze(timer,nowMin){
  if(level(timer)!=="P1")return false;
  if((timer.snoozes||0)>=MAX_SNOOZES)return false;
  timer.snoozes=(timer.snoozes||0)+1;timer.snoozedUntil=nowMin+SNOOZE_MIN;return true;
}
function card(alerts){return alerts.find(a=>a.form==="card")||null;}
function banners(alerts){return alerts.filter(a=>a.form==="banner");}

// Medication administration. No DOM.
// Every dose keeps two times: givenAt (when it went in, chosen by the user) and
// recordedAt (when it was entered). Reassessment timers run from givenAt.

const GIVEN_AGO_MIN=[0,1,2,5,10];

function doseCount(session,medId){return (session.doses||[]).filter(d=>d.medId===medId).length||session.doseCounts?.[medId]||0;}

function canGive(session,med){
  const n=doseCount(session,med.id);
  if(med.maxDoses&&n>=med.maxDoses)return {ok:false,reason:`${med.name}: pathway dose limit reached (${med.maxDoses}). Escalate and verify orders.`};
  return {ok:true,reason:""};
}

// Returns {dose, timer} or throws when the limit blocks the dose.
function recordDose(session,med,{givenAtMs,recordedAtMs}){
  const check=canGive(session,med);if(!check.ok)throw new Error(check.reason);
  if(givenAtMs>recordedAtMs)throw new RangeError("A dose cannot be given in the future");
  session.doses=session.doses||[];session.doseCounts=session.doseCounts||{};
  const n=doseCount(session,med.id)+1;
  const dose={medId:med.id,n,givenAt:Math.max(0,givenAtMs),recordedAt:recordedAtMs};
  session.doses.push(dose);session.doseCounts[med.id]=n;
  session.doses.sort((a,b)=>a.givenAt-b.givenAt);
  const timer=med.timer?{label:med.timerLabel||`Reassess after ${med.name}`,dueAt:dose.givenAt/60000+med.timer,kind:"medication",medId:med.id}:null;
  return {dose,timer};
}

// Session timeline: append-only. Each entry carries seq, wallAt and at (elapsed ms on the
// session clock). Undo appends a reversing entry; nothing is deleted. No DOM.

function appendEvent(session,{text,type="note",at,data}){
  session.events=session.events||[];
  session.seq=(session.seq||session.events.length)+1;
  const ev={id:`e${session.seq}`,seq:session.seq,wallAt:new Date().toISOString(),at,type,text,...(data?{data}:{})};
  session.events.unshift(ev);
  return ev;
}
// Newest first by clock time; ties by sequence (later entry first).
function timeline(session){return [...(session.events||[])].sort((a,b)=>(b.at-a.at)||((b.seq||0)-(a.seq||0)));}

// Debrief export: plain text, no identifiers.
function exportText(session,{title,fmt}){
  const lines=[`${title}`,`${session.mode==="simulation"?"Simulation":"Clinical"} session · started ${session.startedAt}`,""];
  [...timeline(session)].reverse().forEach(e=>lines.push(`${fmt(e.at)}  ${e.text}`));
  const ans=session.decisions?.answers||[];
  if(ans.length){lines.push("","Decisions:");ans.forEach(a=>lines.push(`${fmt(a.at)}  ${a.id} → ${a.value.toUpperCase()}`));}
  const doses=session.doses||[];
  if(doses.length){lines.push("","Doses (given / recorded):");doses.forEach(d=>lines.push(`${fmt(d.givenAt)} / ${fmt(d.recordedAt)}  ${d.medId} #${d.n}`));}
  if(session.notes?.length){lines.push("","Instructor notes:");session.notes.forEach(n=>lines.push(`${fmt(n.at)}  ${n.text}`));}
  return lines.join("\n");
}

// Shoulder dystocia: clock since head delivery, maneuver log, delivery time. No DOM.

function logManeuver(session,id,atMs){
  session.maneuvers=session.maneuvers||[];
  const entry={id,at:atMs,n:session.maneuvers.filter(m=>m.id===id).length+1};
  session.maneuvers.push(entry);return entry;
}
function attempts(session,id){return (session.maneuvers||[]).filter(m=>m.id===id);}
// First maneuver in the configured order not yet tried.
function suggestNext(session,config){
  for(const s of config.sections)for(const id of s.ids)if(!attempts(session,id).length)return id;
  return null;
}
function markDelivered(session,atMs){if(session.deliveredAt==null)session.deliveredAt=atMs;return session.deliveredAt;}
// Head-to-body interval in ms (null until delivered).
function headToBody(session){return session.deliveredAt==null?null:session.deliveredAt;}

// Two-state cockpit rendering: Decision Mode and the Split Action Dashboard.
// Pure HTML builders; app.js owns state and events. See DESIGN-RULES.md.

const SECTION_TITLES={now:"NOW / DUE",ongoing:"ONGOING",completed:"COMPLETED",next:"UP NEXT"};

// ---- State A: full-screen decision ----
function decisionModeHTML({e,d,ctx,pendingCount,waitingCount}){
  const [a,b]=d.answers;
  return `<section class="decision-mode ${e.accent}" role="dialog" aria-modal="true" aria-labelledby="decisionQ">
    <header class="dm-head"><span class="dm-tag">${ctx.esc((e.id==="pph"?"PPH":e.short).toUpperCase())} · DECISION</span><strong class="live-elapsed dm-clock">${ctx.fmt(ctx.nowMs)}</strong></header>
    <h1 id="decisionQ" tabindex="-1">${ctx.esc(d.q)}</h1>
    <div class="dm-answers">
      <button class="dm-yes" data-answer="${a.value}" data-decision="${d.id}" aria-keyshortcuts="Y">${ctx.esc(a.label)}</button>

    <footer class="dm-foot"><button class="dm-back" data-action="defer-decision" data-decision="${d.id}" aria-keyshortcuts="Escape">‹ Back to actions</button><span>${pendingCount} action${pendingCount===1?"":"s"} pending${waitingCount>1?` · ${waitingCount-1} more question${waitingCount>2?"s":""}`:""}</span></footer>
  </section>`;
}

// ---- State B: split action dashboard ----
function primaryAction(t,stored){
  if(t.type==="med")return {action:"done",label:"Record dose"};
  if(t.type==="repeat")return {action:"done",label:"Assessed ✓"};
  if(t.type==="ongoing"&&stored!=="ongoing"&&stored!=="progress")return {action:"ongoing",label:"Started ✓"};
  return {action:"done",label:"DONE ✓"};
}

function urgentHTML({t,ctx,pinnedNote,icon=""}){
  if(!t)return `<section class="dash-urgent empty" aria-label="Most urgent"><span class="du-label">MOST URGENT</span><h2>All listed actions recorded</h2><p class="du-sub">Keep reassessing. Questions appear when due.</p></section>`;
  const st=ctx.stored(t.id),pa=primaryAction(t,st);
  return `<section class="dash-urgent ${t.priority}${ctx.overdue(t.id)?" is-overdue":""}" id="card-${t.id}" aria-label="Most urgent action">
    <div class="du-top"><span class="du-label">${pinnedNote?ctx.esc(pinnedNote):"MOST URGENT"}</span><button class="info-dot" data-task-info="${t.id}" data-emergency-id="${ctx.emergencyId}" aria-label="Details">i</button></div>
    ${icon?`<div class="du-icon" aria-hidden="true">${icon}</div>`:""}
    ${ctx.statusHTML(t)}
    <h2>${ctx.esc(ctx.label(t))}</h2>
    ${ctx.sub(t)?`<p class="du-sub">${ctx.esc(ctx.sub(t))}</p>`:""}
    <button class="du-done" data-task-action="${pa.action}" data-task-id="${t.id}" aria-keyshortcuts="D">${pa.label}</button>
    ${pa.action==="done"&&t.type!=="med"&&t.type!=="repeat"&&st!=="ongoing"&&st!=="progress"?`<button class="du-second" data-task-action="ongoing" data-task-id="${t.id}">Mark ongoing</button>`:""}
  </section>`;
}

const ICON={pending:"",ongoing:"",completed:"✓",overdue:""};
function rowHTML(t,kind,ctx){
  const over=ctx.overdue(t.id),k=over&&kind!=="completed"?"overdue":kind;
  return `<button class="ck-row ${k} ${t.priority}" data-check="${t.id}"><span class="ck-box ${k==="now"||k==="next"?"pending":k}" aria-hidden="true">${ICON[k==="now"||k==="next"?"pending":k]}</span><span class="ck-name">${ctx.esc(ctx.check(t))}</span><span class="ck-state">${ctx.rowState(t,kind)}</span></button>`;
}

function checklistHTML({c,ctx,open}){
  const sec=(key,list,collapsible)=>{
    if(!list.length&&key!=="now")return "";
    const isOpen=open[key]??!collapsible;
    const body=list.length?list.map(t=>rowHTML(t,key,ctx)).join(""):`<p class="ck-empty">Nothing else due now.</p>`;
    return `<section class="ck-sec ck-${key}">
      <button class="ck-head" data-action="toggle-section" data-section="${key}" aria-expanded="${isOpen}"><i class="chev${isOpen?" open":""}" aria-hidden="true"></i><span>${SECTION_TITLES[key]} (${list.length})</span>${!isOpen&&list.length?`<b class="${key==="completed"?"ok":""}">${key==="completed"?"✓ ":""}${list.length}</b>`:""}</button>
      ${isOpen?`<div class="ck-list">${body}</div>`:""}
    </section>`;
  };
  return `<div class="ck-top"><span>CHECKLIST</span><b>${c.done}/${c.total}</b></div>
    ${sec("now",c.now,false)}${sec("ongoing",c.ongoing,false)}${sec("completed",c.completed,true)}${sec("next",c.next,true)}`;
}

// ---- Shoulder dystocia: clock left, maneuver log right ----
function dystociaLeftHTML({ctx,nextId,delivered}){
  if(delivered!=null)return `<section class="dash-urgent clock-left delivered" aria-label="Head-to-body interval">
    <span class="du-label">HEAD-TO-BODY</span><strong class="big-clock">${ctx.fmt(delivered)}</strong>
    <p class="du-sub">Delivered. Neonatal team · PPH watch · document.</p>
    <button class="du-done" data-check="sd-after">After delivery ›</button></section>`;
  return `<section class="dash-urgent clock-left" aria-label="Time since head delivered">
    <span class="du-label">SINCE HEAD DELIVERED</span>
    <strong class="big-clock live-elapsed" aria-live="off">${ctx.fmt(ctx.nowMs)}</strong>
    ${nextId?`<button class="du-second next-man" data-maneuver="${nextId}">Next: <b>${ctx.esc(ctx.check({id:nextId}))}</b> · log</button>`:""}
    <button class="du-done delivered-btn" data-action="mark-delivered">Baby delivered</button>
  </section>`;
}
function maneuverLogHTML({config,ctx,attempts,setup}){
  const row=id=>{const a=attempts(id),last=a[a.length-1];
    return `<button class="ck-row man ${a.length?"completed":"pending"}" data-maneuver="${id}"><span class="ck-box ${a.length?"completed":"pending"}" aria-hidden="true">${a.length?"✓":""}</span><span class="ck-name">${ctx.esc(ctx.check({id}))}</span><span class="ck-state">${a.length?`${a.length>1?`×${a.length} · `:""}${ctx.fmt(last.at)}`:"tap to log"}</span></button>`;};
  return `<div class="ck-top"><span>MANEUVER LOG</span><b>${config.sections.reduce((n,s)=>n+s.ids.filter(id=>attempts(id).length).length,0)}</b></div>
    <section class="ck-sec ck-now"><h3 class="ck-head"><span>SET UP</span></h3><div class="ck-list">${setup.map(t=>rowHTML(t.task,t.kind,ctx)).join("")}</div></section>
    ${config.sections.map(s=>`<section class="ck-sec"><h3 class="ck-head"><span>${ctx.esc(s.title.toUpperCase())}</span></h3><div class="ck-list">${s.ids.map(row).join("")}</div></section>`).join("")}
    <button class="text-button undo-man" data-action="undo-maneuver">Undo last log entry</button>`;
}

// ---- P1 alert card (over the dashboard) ----
function alertCardHTML(a,ctx){
  const t=a.timer;
  return `<section class="alert-card" role="alert">
    <div><span class="ac-label">REASSESS</span><strong>${ctx.esc(t.label)}</strong><span class="ac-time live-overdue" data-due-at="${t.dueAt}">overdue ${ctx.fmt((ctx.nowMs/60000-t.dueAt)*60000)}</span></div>
    <div class="ac-actions">
      ${t.taskId?`<button class="button primary" data-task-action="done" data-task-id="${t.taskId}">Assessed ✓</button>`:""}
      <button class="button secondary" data-action="ack-timer" data-timer-id="${t.id}">Acknowledge</button>
      <button class="button ghost" data-action="snooze-timer" data-timer-id="${t.id}">Snooze 1 min</button>
    </div>
  </section>`;
}

let practice=(()=>{try{const q=new URLSearchParams(location.search).get("practice");if(q!==null){q==="0"?sessionStorage.removeItem("oba.practice"):sessionStorage.setItem("oba.practice","1");history.replaceState(history.state,"",location.pathname);}return sessionStorage.getItem("oba.practice")==="1";}catch{return false;}})();
function setPractice(on){practice=on;try{on?sessionStorage.setItem("oba.practice","1"):sessionStorage.removeItem("oba.practice");}catch{}}
let selectedEmergency = null;
let flowEmergency = "pph";
let session = hydrateSession(store.loadSession());
let clockHandle = null;
let audioContext = null;
let settings = loadSettings();
let suppressStoreNotification = false;
let expandedTask = null; // UI-only: which compact row is open in the cockpit
let sidePanel = null;   // UI-only: which cockpit side panel is open (flow | meds | timers | timeline); starts closed
const WIDE = window.matchMedia("(min-width:680px)");

function loadSettings(){
  try{return {...{noticeDismissed:false,sound:true},...JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")};}catch{return {noticeDismissed:false,sound:true};}
}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}
function hydrateSession(s){
  if(!s) return null;
  if(s.status==="active" && s.mode==="clinical" && s.running) s.elapsedBase += Math.max(0,Date.now()-s.lastSavedAt);
  s.lastSavedAt=Date.now();
  return s;
}
function saveSession(action={}){
  if(!session){store.clear();return true;}
  const now=Date.now();
  const next=JSON.parse(JSON.stringify(session));
  if(next.running){next.elapsedBase=currentElapsed();next.lastTickAt=now;}
  next.lastSavedAt=now;
  const expectedRevision=session.revision||0;
  suppressStoreNotification=true;
  const result=store.recordAction({
    expectedRevision,nextState:next,
    event:{
      eventId:action.eventId||uid(),sessionId:session.id,taskId:action.taskId||null,
      type:action.type||"STATE_SAVED",status:action.status||null,
      actor:action.actor||"local-device",occurredAt:new Date().toISOString(),
      schemaVersion:"1.0",revision:expectedRevision+1,
      simulationTimeMs:session.mode==="simulation"?currentElapsed():null,
      payload:action.payload||{}
    }
  });
  suppressStoreNotification=false;
  if(result.conflict){session=hydrateSession(result.session);toast("Session changed; latest state restored","alert");return false;}
  if(result.session)session=result.session;
  return !!result.applied;
}
function uid(){return Math.random().toString(36).slice(2,8);}
function taskLabel(task){return SHORT_TASKS[task.id]||task.title;}
function esc(value){return String(value??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(ms,includeHours=false){
  ms=Math.max(0,ms); const total=Math.floor(ms/1000),s=total%60,m=Math.floor(total/60)%60,h=Math.floor(total/3600);
  return (includeHours||h?`${String(h).padStart(2,"0")}:`:"")+`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function currentElapsed(){
  if(!session) return 0;
  return session.elapsedBase + (session.running ? Date.now()-session.lastTickAt : 0);
}
function sessionMinute(){return currentElapsed()/60000;}
function refTags(ids=[]){return `<div class="ref-tags">${ids.map(id=>{const r=getReference(id);return r?`<span>${esc(r.short)}</span>`:"";}).join("")}</div>`;}

function navigate(next,opts={}){
  route=next;
  if(opts.emergency) selectedEmergency=opts.emergency;
  $$(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.nav===route));
  render();
  main.focus({preventScroll:true});
  window.scrollTo({top:0,behavior:"instant"});
}

let routeStack=[],shownRoute=route,routeBack=false;
function render(){
  if(route!==shownRoute){if(!routeBack)routeStack.push(shownRoute);if(routeStack.length>20)routeStack.shift();shownRoute=route;}routeBack=false;
  const cockpit=route==="emergency"&&session?.status==="active";
  document.body.classList.toggle("in-cockpit",cockpit);
  $("#clinicalNotice").hidden=settings.noticeDismissed||cockpit;
  if(route==="emergency") renderEmergency();
  if(route==="flowcharts") renderFlowcharts();
  if(route==="medications") renderMedications();
  if(route==="education") renderEducation();
  if(cockpit)refreshSideSheet();
  updateHeader();
}

function updateHeader(){
  const sub=$("#headerSubtitle");if(!sub)return;
  sub.textContent=session?.status==="active"?`${session.mode==="simulation"?"Simulation":"Clinical"} · ${EMERGENCIES[session.emergencyId].short}`:"Immediate guidance";
}

// State A: full-screen Decision Mode when a clinically reviewed question is due.
// State B: Split Action Dashboard — most urgent action left (55%), checklist right (45%).
const sectionOpen={}; // per session: {completed,next} collapse state (UI only)
function openState(){const k=session.id;sectionOpen[k]=sectionOpen[k]||{completed:false,next:false};return sectionOpen[k];}
function storedStatus(id){return session.tasks[id]?.status;}
function checkLabel(t){return CHECK_LABELS[t.id]||taskLabel(t);}
function cockpitCtx(){
  const nowMs=currentElapsed(),nowMin=nowMs/60000;
  return {esc,fmt,nowMs,emergencyId:session.emergencyId,label:t=>taskLabel(t).replace(/\.$/,""),check:checkLabel,sub:t=>TASK_SUBTITLES[t.id],stored:storedStatus,
    overdue:id=>!!overdueTimerFor(id),
    statusHTML:t=>taskStatusHTML(t,taskState(t.id)),
    rowState:(t,kind)=>{
      const od=overdueTimerFor(t.id);
      if(od&&kind!=="completed")return `<span class="due-pill">Due now</span>`;
      if(kind==="completed")return `<span class="ck-time">${fmt(taskState(t.id).completedAt||0)}</span>`;
      if(kind==="ongoing"){const nx=session.timers.find(x=>x.taskId===t.id&&!x.cancelled&&!x.ack);return nx?`<span class="ck-time">in <span class="live-countdown" data-due-at="${nx.dueAt}">${formatCountdown(nx)}</span></span>`:"";}
      return "";
    }};
}
function checklistModel(){
  const e=EMERGENCIES[session.emergencyId];
  D.ensureDecisionState(session);
  const overdue=new Set(getDueTimers().filter(t=>t.taskId).map(t=>t.taskId));
  return buildChecklist({tasks:e.tasks,states:session.tasks,overdue,activated:new Set(session.branch.activated),gated:new Set(GATED[e.id]||[]),pinned:session.branch.pinned});
}

function statusStripHTML2(waitingList,alerts,sim){
  const parts=[];

  const od=getDueTimers().length;
  if(od)parts.push(`<b class="overdue-count">${od} overdue</b>`);
  const next=getFutureEvents()[0];
  if(next)parts.push(`<span class="next-up">Next: ${esc(next.label)} in <span class="live-countdown" data-due-at="${next.at}">${fmt((next.at-sessionMinute())*60000)}</span></span>`);

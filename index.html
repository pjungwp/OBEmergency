<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2149">
  <meta name="description" content="Phone-first obstetric emergency guidance, timers, flowcharts, medications, and simulation.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" as="image" type="image/webp" href="img/aurora-900.webp" imagesrcset="img/aurora-900.webp 900w, img/aurora-1600.webp 1600w" imagesizes="(min-width:800px) 800px, 100vw">
  <script>try{if(JSON.parse(localStorage.getItem("ob-emergency-assist.settings.v1")||"{}").largeText)document.documentElement.classList.add("text-lg");}catch{}</script>
  <style>
    /* Splash: shown until the app is ready; the loader is real and animated (art has none baked in). */
    #splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#7a0204;overflow:hidden;transition:opacity .35s ease}
    #splash::before{content:"";position:absolute;inset:-40px;background:url(img/splash-640.webp) center/cover;filter:blur(28px) saturate(1.1);opacity:.75}
    #splash .spl-art{position:relative;width:min(100vw,66.667vh);width:min(100vw,66.667dvh);aspect-ratio:2/3}
    #splash img{display:block;width:100%;height:100%;object-fit:contain}
    #splash .spl-load{position:absolute;left:0;right:0;top:82.5%;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;font:italic 800 clamp(15px,3.6vmin,24px) Inter,ui-sans-serif,system-ui,sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.35)}
    #splash .spl-ring{position:relative;width:clamp(40px,9vmin,64px);aspect-ratio:1;animation:splSpin 1s steps(10) infinite}
    #splash .spl-ring i{position:absolute;left:50%;top:0;width:17%;height:17%;margin-left:-8.5%;border-radius:50%;background:#ffe6d2;transform-origin:50% 294%}
    #splash.done{opacity:0;pointer-events:none}
    @keyframes splSpin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#splash .spl-ring{animation-duration:3s}}
  </style>
  <link rel="stylesheet" href="styles.css">
  <title>OB Emergency Assist</title>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading OB Emergency Assist">
    <div class="spl-art"><picture><source type="image/webp" srcset="img/splash-640.webp 640w, img/splash.webp 1024w" sizes="(min-height:1000px) 1024px, 640px"><img src="img/splash.jpg" alt="" width="1024" height="1536" fetchpriority="high"></picture>
      <div class="spl-load"><span class="spl-ring" aria-hidden="true"><i style="transform:rotate(0deg);opacity:0.15"></i><i style="transform:rotate(36deg);opacity:0.23"></i><i style="transform:rotate(72deg);opacity:0.32"></i><i style="transform:rotate(108deg);opacity:0.41"></i><i style="transform:rotate(144deg);opacity:0.49"></i><i style="transform:rotate(180deg);opacity:0.58"></i><i style="transform:rotate(216deg);opacity:0.66"></i><i style="transform:rotate(252deg);opacity:0.75"></i><i style="transform:rotate(288deg);opacity:0.83"></i><i style="transform:rotate(324deg);opacity:0.92"></i></span><span>Loading…</span></div></div>
  </div>
  <script>try{if(sessionStorage.getItem("oba.splash"))document.getElementById("splash").remove();else{sessionStorage.setItem("oba.splash","1");window.__splashAt=Date.now();}}catch{}</script>
  <div id="app" class="app-shell">
    <header class="app-header">
      <button class="hdr-btn square" data-action="open-menu" aria-label="Open menu" aria-controls="menuDrawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="hdr-actions">
        <button class="hdr-btn pill" data-action="toggle-text" aria-pressed="false" title="Larger text" aria-label="Larger text">
          <span class="aa" aria-hidden="true">A<b>A</b></span><span class="lbl">Larger text</span>
        </button>
        <button class="hdr-btn pill" data-action="team-join" title="Join a team session" aria-label="Join a team session" data-team-only hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.6.2 4.6 1.7 5.1 4.8"/></svg><span class="lbl">Join team</span>
        </button>
        <button class="hdr-btn pill" data-action="share" title="Share this" aria-label="Share this">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2v2h-2zM18 14h2v2h-2z"/></svg><span class="lbl">Share this</span>
        </button>
        <button class="hdr-btn pill primary" data-action="install" title="Download app" aria-label="Download app">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl lbl-keep">Download app</span>
        </button>
      </div>
      <button class="hdr-avatar" data-action="show-about" aria-label="About OB Emergency Assist" title="About"><picture><source type="image/webp" srcset="img/avatar.webp"><img src="img/avatar.png" alt="" width="44" height="44"></picture></button>
    </header>

    <div id="clinicalNotice" class="clinical-notice">
      <span><strong>Clinical prototype:</strong> verify against your institution’s current policy before clinical use.</span>
      <button data-action="dismiss-notice" aria-label="Dismiss notice">×</button>
    </div>

    <main id="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-nav="emergency" class="nav-item active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z"/></svg><small>Emergency</small></button>
      <button data-nav="flowcharts" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg><small>Flowcharts</small></button>
      <button data-nav="medications" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/></svg><small>Medications</small></button>
      <button data-nav="education" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1 6-1 9 1.5 3-2.5 6-2.5 9-1.5V19c-3-1-6-1-9 1.5C9 18 6 18 3 19z"/><path d="M12 7v13.5"/></svg><small>Education</small></button>
    </nav>
  </div>

  <div id="drawerBackdrop" class="sheet-backdrop" data-action="close-menu" hidden></div>
  <nav id="menuDrawer" class="menu-drawer" aria-label="Main menu" hidden>
    <div class="drawer-head"><span class="hdr-avatar" aria-hidden="true"><img src="img/avatar.png" alt="" width="44" height="44"></span><div><strong>OB Emergency Assist</strong><small>Ready when seconds matter.</small></div><button class="icon-button" data-action="close-menu" aria-label="Close menu">×</button></div>
    <button data-nav="emergency">Emergency scenarios</button>
    <button data-nav="flowcharts">Flowcharts</button>
    <button data-nav="medications">Medications</button>
    <button data-nav="education">Education &amp; TeamSTEPPS</button>
    <a href="sim-master.html">Facilitate a simulation <small>Sim Master</small></a>
    <a href="index.html?practice=1">Practice mode <small>team phone during a sim</small></a>
    <hr>
    <button data-action="toggle-text">Larger text <small id="drawerTextState">Off</small></button>
    <button data-action="team-join" data-team-only hidden>Join a team session <small>enter a code</small></button>
    <button data-action="share">Share this app</button>
    <button data-action="install">Download app</button>
    <button data-action="show-about">About &amp; sources</button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <aside id="infoSheet" class="info-sheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <div><small id="sheetEyebrow"></small><h2 id="sheetTitle"></h2></div>
      <button class="icon-button" data-action="close-sheet" aria-label="Close">×</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </aside>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <template id="confirmTemplate">
    <div class="confirm-card">
      <h2></h2><p></p>
      <div class="button-row"><button class="button secondary" data-confirm="cancel">Cancel</button><button class="button danger" data-confirm="yes">Confirm</button></div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>

name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test session logic and package
        run: npm test
      - name: Build Apps Script HTML
        run: npm run build:gas
      - name: Save Apps Script package
        uses: actions/upload-artifact@v6
        with:
          name: ob-emergency-apps-script
          path: |
            google-apps-script/Code.gs
            google-apps-script/Index.html
            google-apps-script/appsscript.json
          if-no-files-found: error
          retention-days: 14
